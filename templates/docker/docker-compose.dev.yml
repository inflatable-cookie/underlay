# Docker Compose for Underlay-based Development
#
# Template for local development services.
#
# Placeholders (replace before use):
#   {{PROJECT_NAME}}  - Your project name (e.g., "acme", "myapp")
#   {{DB_NAME}}       - Database name (e.g., "acme", "myapp_dev")
#   {{DB_USER}}       - Database user (e.g., "root", "myapp_user")
#   {{DB_PASSWORD}}   - Database password
#
# Usage:
#   docker compose up -d          # Start all services
#   docker compose up -d postgres # Start just PostgreSQL
#   docker compose logs -f        # View logs
#   docker compose down           # Stop all services
#   docker compose down -v        # Stop and remove volumes (fresh start)
#
# Services:
#   - postgres: PostgreSQL 16 database on port 5432
#   - minio: S3-compatible blob storage on port 9000 (console on 9001)
#   - mailhog: Email testing on port 8025 (SMTP on 1025)

services:
  # ==========================================================================
  # PostgreSQL Database
  # ==========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: {{PROJECT_NAME}}-postgres
    environment:
      POSTGRES_USER: {{DB_USER}}
      POSTGRES_PASSWORD: {{DB_PASSWORD}}
      POSTGRES_DB: {{DB_NAME}}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {{DB_USER}} -d {{DB_NAME}}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==========================================================================
  # MinIO (S3-compatible blob storage)
  # ==========================================================================
  # Access the console at http://localhost:9001
  # Default credentials: minioadmin / minioadmin
  #
  # Configure your app with:
  #   BLOB_ADAPTER=s3
  #   S3_ENDPOINT=http://localhost:9000
  #   S3_BUCKET={{PROJECT_NAME}}-media
  #   S3_ACCESS_KEY=minioadmin
  #   S3_SECRET_KEY=minioadmin
  #   S3_REGION=us-east-1
  minio:
    # DEV ONLY: :latest and default credentials (minioadmin/minioadmin) are
    # intentional for local development. Pin a digest and use real credentials
    # before reusing any of this beyond a dev machine.
    image: minio/minio:latest
    container_name: {{PROJECT_NAME}}-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Create default bucket on startup
  minio-init:
    image: minio/mc:latest
    container_name: {{PROJECT_NAME}}-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set minio http://minio:9000 minioadmin minioadmin;
      mc mb minio/{{PROJECT_NAME}}-media --ignore-existing;
      mc anonymous set download minio/{{PROJECT_NAME}}-media;
      echo 'Bucket {{PROJECT_NAME}}-media created and configured';
      "
    # NOTE: `mc anonymous set download` makes the bucket publicly readable.
    # Fine for local dev media; do not carry this into deployed environments.
    restart: "no"

  # ==========================================================================
  # MailHog (Email testing)
  # ==========================================================================
  # View captured emails at http://localhost:8025
  # SMTP server available at localhost:1025
  #
  # Configure your app with:
  #   EMAIL_ADAPTER=smtp
  #   SMTP_HOST=localhost
  #   SMTP_PORT=1025
  #   SMTP_FROM=noreply@{{PROJECT_NAME}}.local
  mailhog:
    image: mailhog/mailhog:latest
    container_name: {{PROJECT_NAME}}-mailhog
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
