<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <style>:root {
  --color: black;
  --bg: white;
  --head-bg: white;
  --link: #338;

  --blue: #ccf;
  --red: #fcc;
  --yellow: #ffc;
  --green: #cfc;
}

[data-theme='dark'] {
  --color: white;
  --bg: black;
  --head-bg: #333;
  --link: #aaf;

  --blue: #225;
  --red: #522;
  --yellow: #552;
  --green: #252;
}

html,
body {
  margin: 0;
  padding: 0;
  color: var(--color);
  background: var(--bg);
}

.app {
  margin: 10px;
  padding: 0;
}

.files-list {
  margin: 10px 0 0;
  width: 100%;
  border-collapse: collapse;
}
.files-list__head {
  border: 1px solid #999;
}
.files-list__head > tr > th {
  padding: 10px;
  border: 1px solid #999;
  text-align: left;
  font-weight: normal;
  background: var(--head-bg);
}
.files-list__body {
}
.files-list__file {
  cursor: pointer;
}
.files-list__file:hover {
  background: var(--blue);
}
.files-list__file > td {
  padding: 10px;
  border: 1px solid #999;
}
.files-list__file > td:first-child::before {
  content: '\01F4C4';
  margin-right: 1em;
}
.files-list__file_low {
  background: var(--red);
}
.files-list__file_medium {
  background: var(--yellow);
}
.files-list__file_high {
  background: var(--green);
}
.files-list__file_folder > td:first-child::before {
  content: '\01F4C1';
  margin-right: 1em;
}

.file-header {
  border: 1px solid #999;
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  background: var(--bg);
}

.file-header__back {
  margin: 10px;
  cursor: pointer;
  flex-shrink: 0;
  flex-grow: 0;
  text-decoration: underline;
  color: var(--link);
}

.file-header__name {
  margin: 10px;
  flex-shrink: 2;
  flex-grow: 2;
}

.file-header__stat {
  margin: 10px;
  flex-shrink: 0;
  flex-grow: 0;
}

.file-content {
  margin: 10px 0 0;
  border: 1px solid #999;
  padding: 10px;
  counter-reset: line;
  display: flex;
  flex-direction: column;
}

.code-line::before {
  content: counter(line);
  margin-right: 72px;
}
.code-line {
  margin: 0;
  height: 1em;
  counter-increment: line;

  position: absolute;
  padding: 0 0.3em 0.3em 0.3em;
  display: inherit;
  width: 100%;
}
.code-line_covered {
  background: var(--green);
}
.code-line_uncovered {
  background: var(--red);
}

.code-text-container {
  position: relative;
  height: 1em;
  padding: 0.3em 0;
}

.cover-indicator {
  display: flex;
  width: 100%;
  position: absolute;
  justify-content: end;
  height: 1em;
  align-items: center;
  padding: 0 0.3em 0.3em 0.3em;
}

.cover-indicator.check-cover::after {
  content: "\2713";
  font-weight: bold;
  background-color: var(--green);
  height: 1em;
}

.cover-indicator.no-cover::after {
  content: "\2716";
  font-weight: bold;
  background-color: var(--red);
  height: 1em;
}

.stat-line-hit {
  max-width: 48px;
  overflow: hidden;
  font-weight: bold;
  margin-right: 4px;
  background-color: var(--green);
  position: relative;
  top: 0.1em;
}

#theme-toggle-label {
  margin-left: 1ch;
}
</style>
</head>

e::TOO_MANY_REQUESTS,\n                     AuthError::BadRequest(_) =\u003e StatusCode::BAD_REQUEST,\n                     AuthError::Internal(_) =\u003e StatusCode::INTERNAL_SERVER_ERROR,\n                     AuthError::Unauthorized\n                     | AuthError::InvalidToken\n                     | AuthError::TokenInvalid\n                     | AuthError::TokenMalformed\n                     | AuthError::TokenNotYetValid\n                     | AuthError::TokenFingerprintMismatch\n                     | AuthError::SessionExpired\n                     | AuthError::SessionRevoked =\u003e StatusCode::UNAUTHORIZED,\n                     _ =\u003e StatusCode::UNAUTHORIZED,\n                 };\n                Err(reject(status, auth_err.into_app_error()))\n            }\n        }\n    }\n}\n\nfn reject(\n    status: StatusCode,\n    err: AppError,\n) -\u003e (StatusCode, axum::Json\u003cunderlay_core::ErrorEnvelope\u003e) {\n    // Match `underlay-http` behaviour by setting `x-error-code` when apps use `underlay-http`.\n    // (The rejection type itself stays pure.)\n    (status, axum::Json(err.into_envelope()))\n}\n\npub(crate) fn extract_bearer(header: Option\u003c\u0026http::HeaderValue\u003e) -\u003e Option\u003cString\u003e {\n    let value = header?.to_str().ok()?;\n    let value = value.trim();\n\n    let prefix = \"Bearer \";\n    if !value.starts_with(prefix) {\n        return None;\n    }\n\n    let token = value[prefix.len()..].trim();\n    if token.is_empty() {\n        return None;\n    }\n\n    Some(token.to_string())\n}\n","traces":[{"line":21,"address":[],"length":0,"stats":{"Line":0}},{"line":22,"address":[],"length":0,"stats":{"Line":0}},{"line":36,"address":[],"length":0,"stats":{"Line":0}},{"line":37,"address":[],"length":0,"stats":{"Line":0}},{"line":38,"address":[],"length":0,"stats":{"Line":0}},{"line":39,"address":[],"length":0,"stats":{"Line":0}},{"line":40,"address":[],"length":0,"stats":{"Line":0}},{"line":44,"address":[],"length":0, e refresh token.\n    pub refresh_token_fingerprint: \u0026'a str,\n    /// When the access token expires.\n    pub access_token_expires_at: chrono::DateTime\u003cchrono::Utc\u003e,\n    /// When the refresh token expires.\n    pub refresh_token_expires_at: chrono::DateTime\u003cchrono::Utc\u003e,\n    /// Client IP address.\n    pub ip_address: Option\u003c\u0026'a str\u003e,\n    /// Client user agent.\n    pub user_agent: Option\u003c\u0026'a str\u003e,\n}\n\n/// Result type for repository operations.\npub type RepoResult\u003cT\u003e = Result\u003cT, AuthError\u003e;\n\n/// Repository trait for user operations.\n#[async_trait]\npub trait UserRepository: Send + Sync {\n    /// Find a user by ID.\n    async fn find_by_id(\u0026self, user_id: Uuid) -\u003e RepoResult\u003cOption\u003cUser\u003e\u003e;\n\n    /// Find a user by email.\n    async fn find_by_email(\u0026self, email: \u0026str) -\u003e RepoResult\u003cOption\u003cUser\u003e\u003e;\n\n    /// Create a new user.\n    async fn create(\n        \u0026self,\n        email: \u0026str,\n        display_name: \u0026str,\n    ) -\u003e RepoResult\u003cUser\u003e;\n\n    /// Update a user's status.\n    async fn update_status(\n        \u0026self,\n        user_id: Uuid,\n        status: UserStatus,\n    ) -\u003e RepoResult\u003c()\u003e;\n\n    /// Delete a user (soft delete).\n    async fn delete(\u0026self, user_id: Uuid) -\u003e RepoResult\u003c()\u003e;\n\n    /// Check if email is available.\n    async fn email_available(\u0026self, email: \u0026str) -\u003e RepoResult\u003cbool\u003e;\n}\n\n/// Repository trait for credential operations.\n#[async_trait]\npub trait CredentialRepository: Send + Sync {\n    /// Find a credential by ID.\n    async fn find_by_id(\n        \u0026self,\n        credential_id: Uuid,\n    ) -\u003e RepoResult\u003cOption\u003cCredential\u003e\u003e;\n\n    /// Find all credentials for a user.\n    async fn find_by_user_id(\n        \u0026self,\n        user_id: Uuid,\n    ) -\u003e RepoResult\u003cVec\u003cCredential\u003e\u003e;\n\n    /// Find a password credential for a user.\n    async fn find_password_by_user_id(\n        \u0026self,\n        user_id: Uuid,\n    ) -\u003e RepoResult\u003cOption\u003cCredential\u003e\u003e;\n\n    /// Find a TOTP credential for a user.\n    async fn find_totp_by_user_id(\n        \u0026self,\n        user_id: Uuid,\n    ) -\u003e RepoResult\u003cOption\u003cCredential\u003e\u003e;\n\n    /// Find PassKey credentials for a user.\n    async fn find_passkeys_by_user_id(\n        \u0026self,\n        user_id: Uuid,\n    ) -\u003e RepoResult\u003cVec\u003cCredential\u003e\u003e;\n\n    /// Find OAuth connection for a user and provider.\n    async fn find_oauth_by_user_and_provider(\n        \u0026self,\n        user_id: Uuid,\n        provider: CredentialType,\n    ) -\u003e RepoResult\u003cOption\u003cCredential\u003e\u003e;\n\n    /// Create a new credential.\n    async fn create(\n        \u0026self,\n        user_id: Uuid,\n        credential_type: CredentialType,\n        secret_encrypted: \u0026str,\n        metadata: \u0026CredentialMetadata,\n    ) -\u003e RepoResult\u003cCredential\u003e;\n\n    /// Update a credential's verified status.\n    async fn set_verified(\n        \u0026self,\n        credential_id: Uuid,\n        verified: bool,\n    ) -\u003e RepoResult\u003c()\u003e;\n\n    /// Update last used timestamp.\n    async fn update_last_used(\n        \u0026self,\n        credential_id: Uuid,\n    ) -\u003e RepoResult\u003c()\u003e;\n\n    /// Delete a credential.\n    async fn delete(\u0026self, credential_id: Uuid) -\u003e RepoResult\u003c()\u003e;\n\n    /// Delete all credentials for a user.\n    async fn delete_all_for_user(\u0026self, user_id: Uuid) -\u003e RepoResult\u003c()\u003e;\n}\n\n/// Repository trait for session operations.\n#[async_trait]\npub trait SessionRepository: Send + Sync {\n    /// Find a session by ID.\n    async fn find_by_id(\n        \u0026self,\n        session_i d config;\nmod error;\nmod fingerprint;\nmod keys;\nmod service;\n\npub use crate::claims::{AccessTokenClaims, RefreshTokenClaims, TokenUse};\npub use crate::config::JwtConfig;\npub use crate::error::{JwtError, JwtResult};\npub use crate::fingerprint::token_fingerprint;\npub use crate::keys::KeyPair;\npub use crate::service::{JwtService, SessionManager, SessionState, SessionStore, SessionTokens};\n","traces":[],"covered":0,"coverable":0},{"path":["/","Users","betterthanclay","Dev","libraries","underlay","rust","crates","underlay-auth-jwt","src","service.rs"],"content":"//! JWT issuance + session management.\n\nuse async_trait::async_trait;\nuse base64::{engine::general_purpose::STANDARD, Engine as _};\nuse chrono::Utc;\nuse jsonwebtoken::{decode, encode, Algorithm, DecodingKey, EncodingKey, Header, Validation};\nuse serde::{Deserialize, Serialize};\nuse std::sync::Arc;\nuse underlay_core::Uuid;\n\nuse crate::claims::{AccessTokenClaims, CommonClaims, RefreshTokenClaims, TokenUse};\nuse crate::config::JwtConfig;\nuse crate::error::{JwtError, JwtResult};\nuse crate::fingerprint::token_fingerprint;\n\n#[derive(Clone)]\npub struct JwtService {\n    encoding_key: EncodingKey,\n    decoding_key: DecodingKey,\n    config: JwtConfig,\n}\n\nimpl std::fmt::Debug for JwtService {\n    fn fmt(\u0026self, f: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\n        f.debug_struct(\"JwtService\")\n            .field(\"encoding_key\", \u0026\"[REDACTED]\")\n            .field(\"decoding_key\", \u0026\"[REDACTED]\")\n            .field(\"config\", \u0026self.config)\n            .finish()\n    }\n}\n\nimpl JwtService {\n    pub fn new(config: JwtConfig) -\u003e JwtResult\u003cSelf\u003e {\n        let private_key_der = STANDARD\n            .decode(\u0026config.private_key_b64)\n            .map_err(|_| JwtError::Key(\"Invalid base64 private key\".to_string()))?;\n        let encoding_key = EncodingKey::from_ed_der(\u0026private_key_der);\n\n        let public_key_bytes = base64::engine::general_purpose::URL_SAFE_NO_PAD\n            .decode(\u0026config.public_key_b64)\n            .or_else(|_| base64::engine::general_purpose::STANDARD.decode(\u0026config.public_key_b64))\n            .map_err(|e| JwtError::Key(format!(\"Base64 error: {}\", e)))?;\n        let public_key_b64url = base64::engine::general_purpose::URL_SAFE_NO_PAD.encode(public_key_bytes);\n\n        let decoding_key = DecodingKey::from_ed_components(\u0026public_key_b64url)\n            .map_err(|e| JwtError::Key(e.to_string()))?;\n\n        let service = Self {\n            encoding_key,\n            decoding_key,\n            config,\n        };\n\n        // Fail fast if the keypair is incompatible (startup-time cost only).\n        service.validate_keypair_compatibility()?;\n\n        Ok(service)\n    }\n\n    pub fn config(\u0026self) -\u003e \u0026JwtConfig {\n        \u0026self.config\n    }\n\n    fn validate_keypair_compatibility(\u0026self) -\u003e JwtResult\u003c()\u003e {\n        // Issue and verify a short-lived token using the currently configured\n        // issuer/audience. This is startup-only and prevents silent key mismatch.\n        let session_id = Uuid::new_v7();\n        let user_id = Uuid::new_v7();\n\n        let (token, _claims) = self.issue_access_token(user_id, session_id, vec![])?;\n\n        // If this fails, either the public key doesn't match the private key,\n        // or the validation config is inconsistent.\n        self.verify_access_token(\u0026token).map(|_| ())\n    }\n\n    pub fn issue_access_token(\n        \u0026self,\n        user_id: Uuid,\n        session_id: Uuid,\n        roles: Vec\u003cString\u003e,\n    ) -\u003e JwtResult\u003c(String, AccessTokenClaims)\u003e {\n        let now = Utc::now().timestamp() as u64;\n        let exp = (Utc::now() + self.config.access_token_lifetime())\n            .timestamp() as u64;\n\n        let claims = AccessTokenClaims {\n            common: CommonClaims {\n                issuer: self.config.issuer.clone(),\n                subject: user_id,\n                audience: self.config.audience.clone(),\n                issued_at: now,\n                expires_at: exp,\n                not_before: Some(now),\n                token_id: Uuid::new_v7(),\n            },\n            token_use: TokenUse::Access,\n            session_id,\n            roles,\n        };\n\n        let mut header = Header::new(Algorithm::EdDSA);\n        header.typ = Some(\"JWT\".to_string());\n\n        let token = encode(\u0026header, \u0026claims, \u0026self.encoding_key)\n            .map_err(|e| JwtError::Internal(e.to_string()))?;\n\n        Ok((token, claims))\n    }\n\n    pub fn issue_refresh_token(\n        \u0026self,\n        user_id: Uuid,\n        session_id: Uuid,\n        previous_token_id: Option\u003cUuid\u003e,\n        version: u32,\n    ) -\u003e JwtResult\u003c(String, RefreshTokenClaims)\u003e {\n        let now = Utc::now().timestamp() as u64;\n        let exp = (Utc::now() + self.config.refresh_token_lifetime())\n            .timestamp() as u64;\n\n        let claims = RefreshTokenClaims {\n            common: CommonClaims {\n                issuer: self.config.issuer.clone(),\n                subject: user_id,\n                audience: self.config.audience.clone(),\n                issued_at: now,\n                expires_at: exp,\n                not_before: Some(now),\n                token_id: Uuid::new_v7(),\n            },\n            token_use: TokenUse::Refresh,\n            session_id,\n            previous_token_id,\n            version,\n        };\n\n        let mut header = Header::new(Algorithm::EdDSA);\n        header.typ = Some(\"JWT\".to_string());\n\n        let token = encode(\u0026header, \u0026claims, \u0026self.encoding_key)\n            .map_err(|e| JwtError::Internal(e.to_string()))?;\n\n        Ok((token, claims))\n    }\n\n    pub fn verify_access_token(\u0026self, token: \u0026str) -\u003e JwtResult\u003cAccessTokenClaims\u003e {\n        let claims: AccessTokenClaims = self.decode_and_validate(token)?;\n        if claims.token_use != TokenUse::Access {\n            return Err(JwtError::UnsupportedTokenType);\n        }\n        Ok(claims)\n    }\n\n    pub fn verify_refresh_token(\u0026self, token: \u0026str) -\u003e JwtResult\u003cRefreshTokenClaims\u003e {\n        let claims: RefreshTokenClaims = self.decode_and_validate(token)?;\n        if claims.token_use != TokenUse::Refresh {\n            return Err(JwtError::UnsupportedTokenType);\n        }\n        Ok(claims)\n    }\n\n    fn decode_and_validate\u003cT: serde::de::DeserializeOwned\u003e(\u0026self, token: \u0026str) -\u003e JwtResult\u003cT\u003e {\n        let mut validation = Validation::new(Algorithm::EdDSA);\n        validation.leeway = self.config.leeway_seconds;\n        validation.validate_nbf = true;\n\n        // Require core JWT claims we rely on.\n        if self.config.audience.is_some() {\n            validation.set_required_spec_claims(\u0026[\"exp\", \"iss\", \"sub\", \"aud\"]);\n        } else {\n            validation.set_required_spec_claims(\u0026[\"exp\", \"iss\", \"sub\"]);\n        }\n\n        validation.set_issuer(\u0026[self.config.issuer.clone()]);\n        if let Some(aud) = \u0026self.config.audience {\n            validation.set_audience(\u0026[aud.clone()]);\n        }\n\n        match decode::\u003cT\u003e(token, \u0026self.decoding_key, \u0026validation) {\n            Ok(data) =\u003e Ok(data.claims),\n            Err(err) =\u003e {\n                use jsonwebtoken::errors::ErrorKind;\n                match err.kind() {\n                    ErrorKind::ExpiredSignature =\u003e Err(JwtError::Expired),\n                    ErrorKind::ImmatureSignature =\u003e Err(JwtError::NotYetValid),\n                    ErrorKind::InvalidToken =\u003e Err(JwtError::InvalidToken),\n                    ErrorKind::InvalidSignature =\u003e Err(JwtError::InvalidToken),\n                    ErrorKind::InvalidIssuer =\u003e Err(JwtError::InvalidToken),\n                    ErrorKind::InvalidAudience =\u003e Err(JwtError::InvalidToken),\n                    ErrorKind::Json(_) =\u003e Err(JwtError::MalformedToken),\n                    _ =\u003e Err(JwtError::InvalidToken),\n                }\n            }\n        }\n    }\n}\n\n/// Session state stored in application persistence.\n#[derive(Debug, Clone, Serialize, Deserialize)]\npub struct SessionState {\n    pub id: Uuid,\n    pub user_id: Uuid,\n    pub roles: Vec\u003cString\u003e,\n\n    pub is_active: bool,\n\n    pub access_token_fingerprint: String,\n    pub refresh_token_fingerprint: String,\n\n    pub refresh_token_id: Uuid,\n    pub refresh_token_version: u32,\n}\n\n#[async_trait]\npub trait SessionStore: Send + Sync {\n    async fn get_session(\u0026self, session_id: \u0026Uuid) -\u003e JwtResult\u003cOption\u003cSessionState\u003e\u003e;\n    async fn create_session(\u0026self, session: \u0026SessionState) -\u003e JwtResult\u003c()\u003e;\n    async fn update_session(\u0026self, session: \u0026SessionState) -\u003e JwtResult\u003c()\u003e;\n    async fn delete_session(\u0026self, session_id: \u0026Uuid) -\u003e JwtResult\u003c()\u003e;\n    async fn revoke_all_user_sessions(\u0026self, user_id: \u0026Uuid) -\u003e JwtResult\u003cu64\u003e;\n    async fn get_user_sessions(\u0026self, user_id: \u0026Uuid) -\u003e JwtResult\u003cVec\u003cSessionState\u003e\u003e;\n}\n\n#[derive(Debug, Clone)]\npub struct SessionTokens {\n    pub access_token: String,\n    pub refresh_token: String,\n}\n\n#[derive(Debug, Clone)]\npub struct SessionManager\u003cS: SessionStore\u003e {\n    jwt: JwtService,\n    store: Arc\u003cS\u003e,\n}\n\nimpl\u003cS: SessionStore\u003e SessionManager\u003cS\u003e {\n    pub fn new(jwt: JwtService, store: Arc\u003cS\u003e) -\u003e Self {\n        Self { jwt, store }\n    }\n\n    pub async fn create_session(\u0026self, user_id: Uuid, roles: Vec\u003cString\u003e) -\u003e JwtResult\u003cSessionTokens\u003e {\n        let session_id = Uuid::new_v7();\n        let (access_token, _access_claims) =\n            self.jwt.issue_access_token(user_id, session_id, roles.clone())?;\n\n        let (refresh_token, refresh_claims) =\n            self.jwt.issue_refresh_token(user_id, session_id, None, 1)?;\n\n        let session = SessionState {\n            id: session_id,\n            user_id,\n            roles,\n            is_active: true,\n            access_token_fingerprint: token_fingerprint(\u0026access_token),\n            refresh_token_fingerprint: token_fingerprint(\u0026refresh_token),\n            refresh_token_id: refresh_claims.common.token_id,\n            refresh_token_version: refresh_claims.version,\n        };\n\n        self.store.create_session(\u0026session).await?;\n\n        Ok(SessionTokens {\n            access_token,\n            refresh_token,\n        })\n    }\n\n    pub async fn verify_access_token(\u0026self, token: \u0026str) -\u003e JwtResult\u003cAccessTokenClaims\u003e {\n        let claims = self.jwt.verify_access_token(token)?;\n\n        let session = self\n            .store\n            .get_session(\u0026claims.session_id)\n            .await?\n            .ok_or(JwtError::SessionRevoked)?;\n\n        if !session.is_active {\n            return Err(JwtError::SessionRevoked);\n        }\n\n        if session.access_token_fingerprint != token_fingerprint(token) {\n            return Err(JwtError::TokenFingerprintMismatch);\n        }\n\n        Ok(claims)\n    }\n\n    pub async fn refresh_session(\u0026self, refresh_token: \u0026str) -\u003e JwtResult\u003cSessionTokens\u003e {\n        let claims = self.jwt.verify_refresh_token(refresh_token)?;\n\n        let mut session = self\n            .store\n            .get_session(\u0026claims.session_id)\n            .await?\n            .ok_or(JwtError::SessionRevoked)?;\n\n        if !session.is_active {\n            return Err(JwtError::SessionRevoked);\n        }\n\n        if session.refresh_token_fingerprint != token_fingerprint(refresh_token) {\n            return Err(JwtError::TokenFingerprintMismatch);\n        }\n\n        if session.refresh_token_id != claims.common.token_id {\n            return Err(JwtError::RefreshReplayDetected);\n        }\n\n        if session.refresh_token_version != claims.version {\n            return Err(JwtError::RefreshReplayDetected);\n        }\n\n        let (new_access_token, _access_claims) =\n            self.jwt\n                .issue_access_token(session.user_id, session.id, session.roles.clone())?;\n\n        let (new_refresh_token, new_refresh_claims) = self.jwt.issue_refresh_token(\n            session.user_id,\n            session.id,\n            Some(claims.common.token_id),\n            claims.version + 1,\n        )?;\n\n        session.access_token_fingerprint = token_fingerprint(\u0026new_access_token);\n        session.refresh_token_fingerprint = token_fingerprint(\u0026new_refresh_token);\n        session.refresh_token_id = new_refresh_claims.common.token_id;\n        session.refresh_token_version = new_refresh_claims.version;\n\n        self.store.update_session(\u0026session).await?;\n\n        Ok(SessionTokens {\n            access_token: new_access_token,\n            refresh_token: new_refresh_token,\n        })\n    }\n\n    pub async fn revoke_session(\u0026self, session_id: \u0026Uuid) -\u003e JwtResult\u003c()\u003e {\n        self.store.delete_session(session_id).await\n    }\n\n    pub async fn revoke_all_user_sessions(\u0026self, user_id: \u0026Uuid) -\u003e JwtResult\u003cu64\u003e {\n        self.store.revoke_all_user_sessions(user_id).await\n    }\n\n    pub async fn get_user_sessions(\u0026self, user_id: \u0026Uuid) -\u003e JwtResult\u003cVec\u003cSessionState\u003e\u003e {\n        self.store.get_user_sessions(user_id).await\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use crate::config::JwtConfig;\n    use std::collections::HashMap;\n    use tokio::sync::Mutex;\n\n    #[derive(Debug, Default)]\n    struct MemoryStore {\n        sessions: Mutex\u003cHashMap\u003cUuid, SessionState\u003e\u003e,\n    }\n\n    #[async_trait]\n    impl SessionStore for MemoryStore {\n        async fn get_session(\u0026self, session_id: \u0026Uuid) -\u003e JwtResult\u003cOption\u003cSessionState\u003e\u003e {\n            Ok(self.sessions.lock().await.get(session_id).cloned())\n        }\n\n        async fn create_session(\u0026self, session: \u0026SessionState) -\u003e JwtResult\u003c()\u003e {\n            self.sessions.lock().await.insert(session.id, session.clone());\n            Ok(())\n        }\n\n        async fn update_session(\u0026self, session: \u0026SessionState) -\u003e JwtResult\u003c()\u003e {\n            self.sessions.lock().await.insert(session.id, session.clone());\n            Ok(())\n        }\n\n        async fn delete_session(\u0026self, session_id: \u0026Uuid) -\u003e JwtResult\u003c()\u003e {\n            self.sessions.lock().await.remove(session_id);\n            Ok(())\n        }\n\n        async fn revoke_all_user_sessions(\u0026self, user_id: \u0026Uuid) -\u003e JwtResult\u003cu64\u003e {\n            let mut sessions = self.sessions.lock().await;\n            let before = sessions.len();\n            sessions.retain(|_, s| \u0026s.user_id != user_id);\n            Ok((before - sessions.len()) as u64)\n        }\n\n        async fn get_user_sessions(\u0026self, user_id: \u0026Uuid) -\u003e JwtResult\u003cVec\u003cSessionState\u003e\u003e {\n            Ok(self\n                .sessions\n                .lock()\n                .await\n                .values()\n                .filter(|s| \u0026s.user_id == user_id)\n                .cloned()\n                .collect())\n        }\n    }\n\n    #[tokio::test]\n    async fn issues_verifies_refreshes_and_revokes() {\n        let (config, _keys) = JwtConfig::generate().unwrap();\n        let jwt = JwtService::new(config).unwrap();\n\n        let store = Arc::new(MemoryStore::default());\n        let manager = SessionManager::new(jwt, store.clone());\n\n        let user_id = Uuid::new_v7();\n        let tokens = manager\n            .create_session(user_id, vec![\"user\".to_string()])\n            .await\n            .unwrap();\n\n        let claims = manager.verify_access_token(\u0026tokens.access_token).await.unwrap();\n        assert_eq!(claims.common.subject, user_id);\n\n        let refreshed = manager.refresh_session(\u0026tokens.refresh_token).await.unwrap();\n        assert_ne!(tokens.refresh_token, refreshed.refresh_token);\n\n        // Refresh token replay should be rejected.\n        assert!(matches!(\n            manager.refresh_session(\u0026tokens.refresh_token).await,\n            Err(JwtError::RefreshReplayDetected) | Err(JwtError::TokenFingerprintMismatch)\n        ));\n\n        // Revoke session and ensure access token is rejected.\n        manager.revoke_session(\u0026claims.session_id).await.unwrap();\n        assert!(matches!(\n            manager.verify_access_token(\u0026refreshed.access_token).await,\n            Err(JwtError::SessionRevoked)\n        ));\n    }\n\n    mod key_generation {\n        use crate::{KeyPair, keys::URL_SAFE_NO_PAD};\n        use base64::Engine as _;\n        use super::*;\n\n        #[test]\n        fn generates_unique_key_pairs() {\n            let key1 = KeyPair::generate().unwrap();\n            let key2 = KeyPair::generate().unwrap();\n\n            assert_ne!(\n                key1.private_key_pkcs8_der_b64,\n                key2.private_key_pkcs8_der_b64\n            );\n            assert_ne!(key1.public_key_raw_b64, key2.public_key_raw_b64);\n        }\n\n        #[test]\n        fn generated_keys_are_valid_base64() {\n            let key = KeyPair::generate().unwrap();\n\n            let priv_decoded = STANDARD.decode(\u0026key.private_key_pkcs8_der_b64).unwrap();\n            assert!(!priv_decoded.is_empty());\n\n            let pub_decoded = URL_SAFE_NO_PAD.decode(\u0026key.public_key_raw_b64).unwrap();\n            assert_eq!(pub_decoded.len(), 32);\n        }\n\n        #[test]\n        fn decode_private_key_returns_bytes() {\n            let key = KeyPair::generate().unwrap();\n            let bytes = key.decode_private_key_der().unwrap();\n            assert!(!bytes.is_empty());\n        }\n\n        #[test]\n        fn decode_invalid_base64_fails() {\n            let key = KeyPair::generate().unwrap();\n            let invalid_key = KeyPair {\n                private_key_pkcs8_der_b64: \"not-valid-base64!!!\".to_string(),\n                public_key_raw_b64: key.public_key_raw_b64.clone(),\n            };\n            assert!(invalid_key.decode_private_key_der().is_err());\n        }\n    }\n\n    mod config_tests {\n        use crate::keys::URL_SAFE_NO_PAD;\n        use base64::Engine as _;\n        use super::*;\n\n        #[test]\n        fn default_config_has_sensible_values() {\n            let config = JwtConfig::default();\n\n            assert_eq!(config.access_token_lifetime_minutes, 15);\n            assert_eq!(config.refresh_token_lifetime_days, 30);\n            assert_eq!(config.issuer, \"underlay\");\n            assert!(config.audience.is_none());\n            assert_eq!(config.leeway_seconds, 30);\n        }\n\n        #[test]\n        fn access_token_lifetime_returns_duration() {\n            let config = JwtConfig {\n                access_token_lifetime_minutes: 60,\n                ..JwtConfig::default()\n            };\n            let duration = config.access_token_lifetime();\n            assert_eq!(duration.num_minutes(), 60);\n        }\n\n        #[test]\n        fn refresh_token_lifetime_returns_duration() {\n            let config = JwtConfig {\n                refresh_token_lifetime_days: 7,\n                ..JwtConfig::default()\n            };\n            let duration = config.refresh_token_lifetime();\n            assert_eq!(duration.num_days(), 7);\n        }\n\n        #[test]\n        fn generate_creates_valid_config_and_keys() {\n            let (config, keys) = JwtConfig::generate().unwrap();\n\n            assert!(!config.private_key_b64.is_empty());\n            assert!(!config.public_key_b64.is_empty());\n            assert_eq!(config.issuer, \"underlay\");\n\n            let decoded_priv = STANDARD.decode(\u0026config.private_key_b64).unwrap();\n            assert!(!decoded_priv.is_empty());\n\n            let decoded_pub = URL_SAFE_NO_PAD.decode(\u0026config.public_key_b64).unwrap();\n            assert_eq!(decoded_pub.len(), 32);\n\n            assert_eq!(config.private_key_b64, keys.private_key_pkcs8_der_b64);\n            assert_eq!(config.public_key_b64, keys.public_key_raw_b64);\n        }\n\n        #[test]\n        fn debug_redacts_private_key() {\n            let (config, _) = JwtConfig::generate().unwrap();\n            let debug_str = format!(\"{:?}\", config);\n            assert!(debug_str.contains(\"[REDACTED]\"));\n            assert!(!debug_str.contains(\u0026config.private_key_b64));\n        }\n    }\n\n    mod token_issuance {\n        use super::*;\n\n        #[test]\n        fn issue_access_token_contains_required_claims() {\n            let (config, _) = JwtConfig::generate().unwrap();\n            let jwt = JwtService::new(config).unwrap();\n\n            let user_id = Uuid::new_v7();\n            let session_id = Uuid::new_v7();\n            let roles = vec![\"admin\".to_string(), \"user\".to_string()];\n\n            let (token, claims) = jwt.issue_access_token(user_id, session_id, roles.clone()).unwrap();\n\n            assert!(!token.is_empty());\n            assert_eq!(claims.common.issuer, \"underlay\");\n            assert_eq!(claims.common.subject, user_id);\n            assert_eq!(claims.session_id, session_id);\n            assert_eq!(claims.roles, roles);\n            assert_eq!(claims.token_use, TokenUse::Access);\n            assert!(claims.common.expires_at \u003e claims.common.issued_at);\n            assert!(claims.common.not_before.is_some());\n        }\n\n        #[test]\n        fn issue_refresh_token_contains_required_claims() {\n            let (config, _) = JwtConfig::generate().unwrap();\n            let jwt = JwtService::new(config).unwrap();\n\n            let user_id = Uuid::new_v7();\n            let session_id = Uuid::new_v7();\n            let previous_id = Uuid::new_v7();\n\n            let (token, claims) = jwt\n                .issue_refresh_token(user_id, session_id, Some(previous_id), 2)\n                .unwrap();\n\n            assert!(!token.is_empty());\n            assert_eq!(claims.common.issuer, \"underlay\");\n            assert_eq!(claims.common.subject, user_id);\n            assert_eq!(claims.session_id, session_id);\n            assert_eq!(claims.previous_token_id, Some(previous_id));\n            assert_eq!(claims.version, 2);\n            assert_eq!(claims.token_use, TokenUse::Refresh);\n        }\n\n        #[test]\n        fn tokens_have_unique_token_ids() {\n            let (config, _) = JwtConfig::generate().unwrap();\n            let jwt = JwtService::new(config).unwrap();\n\n            let user_id = Uuid::new_v7();\n            let session_id = Uuid::new_v7();\n\n            let (token1, claims1) = jwt.issue_access_token(user_id, session_id, vec![]).unwrap();\n            let (token2, claims2) = jwt.issue_access_token(user_id, session_id, vec![]).unwrap();\n\n            assert_ne!(token1, token2);\n            assert_ne!(claims1.common.token_id, claims2.common.token_id);\n        }\n    }\n\n    mod token_validation {\n        use super::*;\n\n        #[test]\n        fn valid_access_token_verifies_successfully() {\n            let (config, _) = JwtConfig::generate().unwrap();\n            let jwt = JwtService::new(config).unwrap();\n\n            let user_id = Uuid::new_v7();\n            let session_id = Uuid::new_v7();\n\n            let (token, claims) = jwt.issue_access_token(user_id, session_id, vec![]).unwrap();\n            let verified = jwt.verify_access_token(\u0026token).unwrap();\n\n            assert_eq!(verified.common.subject, user_id);\n            assert_eq!(verified.session_id, session_id);\n            assert_eq!(verified.token_use, TokenUse::Access);\n        }\n\n        #[test]\n        fn valid_refresh_token_verifies_successfully() {\n            let (config, _) = JwtConfig::generate().unwrap();\n            let jwt = JwtService::new(config).unwrap();\n\n            let user_id = Uuid::new_v7();\n            let session_id = Uuid::new_v7();\n\n            let (token, claims) = jwt.issue_refresh_token(user_id, session_id, None, 1).unwrap();\n            let verified = jwt.verify_refresh_token(\u0026token).unwrap();\n\n            assert_eq!(verified.common.subject, user_id);\n            assert_eq!(verified.session_id, session_id);\n            assert_eq!(verified.token_use, TokenUse::Refresh);\n            assert_eq!(verified.version, 1);\n        }\n\n        #[test]\n        fn expired_token_returns_expired_error() {\n            let (config, _) = JwtConfig::generate().unwrap();\n            let jwt = JwtService::new(config.clone()).unwrap();\n\n            let user_id = Uuid::new_v7();\n            let session_id = Uuid::new_v7();\n\n            let (token, _) = jwt.issue_access_token(user_id, session_id, vec![]).unwrap();\n\n            let verified = jwt.verify_access_token(\u0026token);\n            assert!(verified.is_ok());\n        }\n\n        #[test]\n        fn malformed_token_returns_invalid_error() {\n            let (config, _) = JwtConfig::generate().unwrap();\n            let jwt = JwtService::new(config).unwrap();\n\n            let result = jwt.verify_access_token(\"not.a.valid.jwt.token\");\n            assert!(matches!(result, Err(JwtError::InvalidToken)));\n        }\n\n        #[test]\n        fn token_with_wrong_signature_fails() {\n            let (config1, _) = JwtConfig::generate().unwrap();\n            let (config2, _) = JwtConfig::generate().unwrap();\n\n            let jwt1 = JwtService::new(config1).unwrap();\n            let jwt2 = JwtService::new(config2).unwrap();\n\n            let user_id = Uuid::new_v7();\n            let session_id = Uuid::new_v7();\n\n            let (token, _) = jwt1.issue_access_token(user_id, session_id, vec![]).unwrap();\n\n            let result = jwt2.verify_access_token(\u0026token);\n            assert!(matches!(result, Err(JwtError::InvalidToken)));\n        }\n\n        #[test]\n        fn access_token_with_refresh_use_fails() {\n            let (config, _) = JwtConfig::generate().unwrap();\n            let jwt = JwtService::new(config).unwrap();\n\n            let user_id = Uuid::new_v7();\n            let session_id = Uuid::new_v7();\n\n            let (refresh_token, _) = jwt.issue_refresh_token(user_id, session_id, None, 1).unwrap();\n\n            let result = jwt.verify_access_token(\u0026refresh_token);\n\n            assert!(matches!(result, Err(JwtError::UnsupportedTokenType | JwtError::MalformedToken)), \n                    \"Expected UnsupportedTokenType or MalformedToken but got: {:?}\", result);\n        }\n\n        #[test]\n        fn refresh_token_with_access_use_fails() {\n            let (config, _) = JwtConfig::generate().unwrap();\n            let jwt = JwtService::new(config).unwrap();\n\n            let user_id = Uuid::new_v7();\n            let session_id = Uuid::new_v7();\n\n            let (access_token, _) = jwt.issue_access_token(user_id, session_id, vec![]).unwrap();\n\n            let result = jwt.verify_refresh_token(\u0026access_token);\n\n            assert!(matches!(result, Err(JwtError::UnsupportedTokenType | JwtError::MalformedToken)),\n                    \"Expected UnsupportedTokenType or MalformedToken but got: {:?}\", result);\n        }\n\n        #[test]\n        fn token_with_wrong_issuer_fails() {\n            let (config, _) = JwtConfig::generate().unwrap();\n            let jwt = JwtService::new(config.clone()).unwrap();\n\n            let user_id = Uuid::new_v7();\n            let session_id = Uuid::new_v7();\n\n            let (token, _) = jwt.issue_access_token(user_id, session_id, vec![]).unwrap();\n\n            let config_wrong_issuer = JwtConfig {\n                issuer: \"wrong-issuer\".to_string(),\n                ..config\n            };\n            let jwt_wrong = JwtService::new(config_wrong_issuer).unwrap();\n\n            let result = jwt_wrong.verify_access_token(\u0026token);\n            assert!(matches!(result, Err(JwtError::InvalidToken)));\n        }\n\n        #[test]\n        fn token_with_configured_audience_passes() {\n            let config_with_audience = JwtConfig {\n                audience: Some(\"my-app\".to_string()),\n                ..JwtConfig::default()\n            };\n            let (config, _) = JwtConfig::generate().unwrap();\n            let config = JwtConfig {\n                audience: Some(\"my-app\".to_string()),\n                private_key_b64: config.private_key_b64.clone(),\n                public_key_b64: config.public_key_b64.clone(),\n                ..config_with_audience\n            };\n\n            let jwt = JwtService::new(config).unwrap();\n\n            let user_id = Uuid::new_v7();\n            let session_id = Uuid::new_v7();\n\n            let (token, _) = jwt.issue_access_token(user_id, session_id, vec![]).unwrap();\n            let result = jwt.verify_access_token(\u0026token);\n            assert!(result.is_ok());\n        }\n\n        #[test]\n        fn token_without_audience_fails_with_audience_config() {\n            let config_no_audience = JwtConfig::generate().unwrap().0;\n            let jwt_no_aud = JwtService::new(config_no_audience.clone()).unwrap();\n\n            let config_with_aud = JwtConfig {\n                audience: Some(\"my-app\".to_string()),\n                ..config_no_audience\n            };\n            let jwt_with_aud = JwtService::new(config_with_aud).unwrap();\n\n            let user_id = Uuid::new_v7();\n            let session_id = Uuid::new_v7();\n\n            let (token, _) = jwt_no_aud.issue_access_token(user_id, session_id, vec![]).unwrap();\n\n            let result = jwt_with_aud.verify_access_token(\u0026token);\n            assert!(matches!(result, Err(JwtError::InvalidToken)));\n        }\n    }\n\n    mod token_fingerprint_tests {\n        use crate::keys::URL_SAFE_NO_PAD;\n        use super::*;\n\n        #[test]\n        fn fingerprint_is_consistent() {\n            let token = \"eyJhbGciOiJFZERTQSIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIn0.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c\";\n\n            let fp1 = token_fingerprint(token);\n            let fp2 = token_fingerprint(token);\n\n            assert_eq!(fp1, fp2);\n        }\n\n        #[test]\n        fn different_tokens_produce_different_fingerprints() {\n            let (config, _) = JwtConfig::generate().unwrap();\n            let jwt = JwtService::new(config).unwrap();\n\n            let user_id = Uuid::new_v7();\n            let session_id = Uuid::new_v7();\n\n            let (token1, _) = jwt.issue_access_token(user_id, session_id, vec![]).unwrap();\n            let (token2, _) = jwt.issue_access_token(user_id, session_id, vec![]).unwrap();\n\n            let fp1 = token_fingerprint(\u0026token1);\n            let fp2 = token_fingerprint(\u0026token2);\n\n            assert_ne!(fp1, fp2);\n        }\n\n        #[test]\n        fn fingerprint_is_base64url_encoded() {\n            let (config, _) = JwtConfig::generate().unwrap();\n            let jwt = JwtService::new(config).unwrap();\n\n            let user_id = Uuid::new_v7();\n            let session_id = Uuid::new_v7();\n\n            let (token, _) = jwt.issue_access_token(user_id, session_id, vec![]).unwrap();\n            let fp = token_fingerprint(\u0026token);\n\n            let decoded = URL_SAFE_NO_PAD.decode(\u0026fp).unwrap();\n            assert_eq!(decoded.len(), 32);\n        }\n    }\n\n    mod error_handling {\n        use super::*;\n\n        #[test]\n        fn jwt_error_codes_are_correct() {\n            assert_eq!(JwtError::Config(\"test\".to_string()).code(), \"auth.jwt_config_error\");\n            assert_eq!(JwtError::Key(\"test\".to_string()).code(), \"auth.jwt_key_error\");\n            assert_eq!(JwtError::Expired.code(), \"auth.token_expired\");\n            assert_eq!(JwtError::NotYetValid.code(), \"auth.token_not_yet_valid\");\n            assert_eq!(JwtError::InvalidToken.code(), \"auth.token_invalid\");\n            assert_eq!(JwtError::MalformedToken.code(), \"auth.token_malformed\");\n            assert_eq!(JwtError::SessionRevoked.code(), \"auth.session_revoked\");\n            assert_eq!(JwtError::TokenFingerprintMismatch.code(), \"auth.token_fingerprint_mismatch\");\n            assert_eq!(JwtError::RefreshReplayDetected.code(), \"auth.token_replay\");\n            assert_eq!(JwtError::UnsupportedTokenType.code(), \"auth.token_invalid\");\n            assert_eq!(JwtError::Internal(\"test\".to_string()).code(), \"auth.internal\");\n        }\n\n        #[test]\n        fn jwt_error_converts_to_auth_error() {\n            use underlay_auth::AuthError;\n\n            assert_eq!(AuthError::SessionExpired, JwtError::Expired.into());\n            assert_eq!(AuthError::TokenNotYetValid, JwtError::NotYetValid.into());\n            assert_eq!(AuthError::TokenInvalid, JwtError::InvalidToken.into());\n            assert_eq!(AuthError::TokenMalformed, JwtError::MalformedToken.into());\n            assert_eq!(AuthError::SessionRevoked, JwtError::SessionRevoked.into());\n            assert_eq!(AuthError::TokenFingerprintMismatch, JwtError::TokenFingerprintMismatch.into());\n            assert_eq!(AuthError::TokenInvalid, JwtError::RefreshReplayDetected.into());\n            assert_eq!(AuthError::TokenInvalid, JwtError::UnsupportedTokenType.into());\n            assert!(matches!(JwtError::Config(\"error\".i ordAuthError::AccountLocked {\n                retry_after_seconds,\n            } =\u003e AuthError::RateLimited {\n                retry_after_seconds,\n            },\n            PasswordAuthError::RateLimited {\n                retry_after_seconds,\n            } =\u003e AuthError::RateLimited {\n                retry_after_seconds,\n            },\n            PasswordAuthError::CredentialNotFound =\u003e AuthError::WrongCredentials,\n            PasswordAuthError::Internal(msg) =\u003e AuthError::Internal(msg),\n        }\n    }\n}\n\nimpl From\u003cstd::io::Error\u003e for PasswordAuthError {\n    fn from(err: std::io::Error) -\u003e Self {\n        PasswordAuthError::Internal(err.to_string())\n    }\n}\n\nimpl From\u003cString\u003e for PasswordAuthError {\n    fn from(err: String) -\u003e Self {\n        PasswordAuthError::Internal(err)\n    }\n}\n\nimpl From\u003cAuthError\u003e for PasswordAuthError {\n    fn from(err: AuthError) -\u003e Self {\n        match err {\n            AuthError::UserNotFound =\u003e PasswordAuthError::CredentialNotFound,\n            AuthError::WrongCredentials =\u003e PasswordAuthError::WrongPassword,\n            AuthError::WrongPassword =\u003e PasswordAuthError::WrongPassword,\n            AuthError::AccountSuspended =\u003e {\n                PasswordAuthError::Internal(\"Account suspended\".to_string())\n            }\n            AuthError::AccountDeleted =\u003e PasswordAuthError::Internal(\"Account deleted\".to_string()),\n            AuthError::RateLimited {\n                retry_after_seconds,\n            } =\u003e PasswordAuthError::RateLimited {\n                retry_after_seconds,\n            },\n            _ =\u003e PasswordAuthError::Internal(err.message()),\n        }\n    }\n}\n\nimpl std::fmt::Display for PasswordAuthError {\n    fn fmt(\u0026self, f: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\n        match self {\n            PasswordAuthError::PasswordTooWeak(msg) =\u003e {\n                write!(f, \"Password too weak: {}\", msg)\n            }\n            PasswordAuthError::PasswordCompromised =\u003e {\n                write!(f, \"Password has been found in a data breach\")\n            }\n            PasswordAuthError::PasswordSameAsCurrent =\u003e {\n                write!(f, \"New password must be different from current password\")\n            }\n            PasswordAuthError::WrongPassword =\u003e {\n                write!(f, \"Password is incorrect\")\n            }\n            PasswordAuthError::AccountLocked {\n                retry_after_seconds,\n            } =\u003e {\n                write!(\n                    f,\n                    \"Account locked. Try again in {} seconds\",\n                    retry_after_seconds\n                )\n            }\n            PasswordAuthError::RateLimited {\n                retry_after_seconds,\n            } =\u003e {\n                write!(\n                    f,\n                    \"Too many attempts. Try again in {} seconds\",\n                    retry_after_seconds\n                )\n            }\n            PasswordAuthError::CredentialNotFound =\u003e {\n                write!(f, \"Password credential not found\")\n            }\n            PasswordAuthError::Internal(msg) =\u003e {\n                write!(f, \"Internal error: {}\", msg)\n            }\n        }\n    }\n}\n\nimpl std::error::Error for PasswordAuthError {}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use underlay_auth::AuthError;\n\n    #[test]\n    fn error_codes_are_correct() {\n        assert_eq!(\n            AuthError::PasswordTooWeak,\n            Into::\u003cAuthError\u003e::into(PasswordAuthError::PasswordTooWeak(\"test\".to_string()))\n        );\n        assert_eq!(\n            AuthError::PasswordCompromised,\n            Into::\u003cAuthError\u003e::into(PasswordAuthError::PasswordCompromised)\n        );\n        assert_eq!(\n            AuthError::WrongCredentials,\n            Into::\u003cAuthError\u003e::into(PasswordAuthError::WrongPassword)\n        );\n        assert_eq!(\n            AuthError::WrongCredentials,\n            Into::\u003cAuthError\u003e::into(PasswordAuthError::CredentialNotFound)\n        );\n    }\n\n    #[test]\n    fn rate_limited_maps_correctly() {\n        use underlay_auth::AuthError;\n\n        let err: AuthError = PasswordAuthError::RateLimited {\n            retry_after_seconds: 60,\n        }\n        .into();\n        assert!(matches!(\n            err,\n            AuthError::RateLimited {\n                retry_after_seconds: 60\n            }\n        ));\n    }\n\n    #[test]\n    fn account_locked_maps_correctly() {\n        use underlay_auth::AuthError;\n\n        let err: AuthError = PasswordAuthError::AccountLocked {\n            retry_after_seconds: 300,\n        }\n        .into();\n        assert!(matches!(\n            err,\n            AuthError::RateLimited {\n                retry_after_seconds: 300\n            }\n        ));\n    }\n\n    #[test]\n    fn display_formatting_is_correct() {\n        let tests = [\n            (\n                PasswordAuthError::PasswordTooWeak(\"try harder\".to_string()),\n                \"Password too weak: try harder\",\n            ),\n            (\n                PasswordAuthError::PasswordCompromised,\n                \"Password has been found in a data breach\",\n            ),\n            (\n                PasswordAuthError::PasswordSameAsCurrent,\n                \"New password must be different from current password\",\n            ),\n            (PasswordAuthError::WrongPassword, \"Password is incorrect\"),\n            (\n                PasswordAuthError::AccountLocked {\n                    retry_after_seconds: 120,\n                },\n                \"Account locked. Try again in 120 seconds\",\n            ),\n            (\n                PasswordAuthError::RateLimited {\n                    retry_after_seconds: 60,\n                },\n                \"Too many attempts. Try again in 60 seconds\",\n            ),\n            (\n                PasswordAuthError::CredentialNotFound,\n                \"Password credential not found\",\n            ),\n            (\n                PasswordAuthError::Internal(\"test error\".to_string()),\n                \"Internal error: test error\",\n            ),\n        ];\n\n        for (err, expected) in tests {\n            assert_eq!(err.to_string(), expected);\n        }\n    }\n\n    #[test]\n    fn io_error_converts_to_internal() {\n        let io_err = std::io::Error::new(std::io::ErrorKind::Other, \"test\");\n        let auth_err: PasswordAuthError = io_err.into();\n        assert!(matches!(auth_err, PasswordAuthError::Internal(msg) if msg.contains(\"test\")));\n    }\n\n    #[test]\n    fn string_converts_to_internal() {\n        let auth_err: PasswordAuthError = \"test error\".to_string().into();\n        assert!(matches!(auth_err, PasswordAuthError::Internal(msg) if msg == \"test error\"));\n    }\n}\n","traces":[{"line":36,"address":[],"length":0,"stats":{"Line":6}},{"line":37,"address":[],"length":0,"stats":{"Line":6}},{"line":38,"address":[],"length":0,"stats":{"Line":1}},{"line":39,"address":[],"length":0,"stats":{"Line":1}},{"line":40,"address":[],"length":0,"stats":{"Line":0}},{"line":41,"address":[],"length":0,"stats":{"Line":1}},{"line":43,"address":[],"length":0,"stats":{"Line":1}},{"line":48,"address":[],"length":0,"stats":{"Line":1}},{"line":52,"address":[],"length":0,"stats":{"Line":1}},{"line":53,"address":[],"length":0,"stats":{"Line":0}},{"line":59,"address":[],"length":0,"stats":{"Line":1}},{"line":60,"address":[],"length":0,"stats":{"Line":1}},{"line":65,"address":[],"length":0,"stats":{"Line":1}},{"line":66,"address":[],"length":0,"stats":{"Line":1}},{"line":71,"address":[],"length":0,"stats":{"Line":0}},{"line":72,"address":[],"length":0,"stats":{"Line":0}},{"line":73,"address":[],"length":0,"stats":{"Line":0}},{ ainst a hash.\n    fn verify_password(\u0026self, password: \u0026[u8], hash: \u0026str) -\u003e Result\u003cbool, io::Error\u003e;\n}\n\n/// Argon2id password hasher with configurable parameters.\n#[derive(Debug, Clone)]\npub struct Argon2Hasher {\n    /// Memory cost in KiB (default: 64 MiB = 65536 KiB).\n    memory_cost: u32,\n    /// Number of iterations (default: 3).\n    iterations: u32,\n    /// Parallelism factor (default: 4).\n    parallelism: u32,\n}\n\nimpl Default for Argon2Hasher {\n    fn default() -\u003e Self {\n        Self {\n            memory_cost: 65536,\n            iterations: 3,\n            parallelism: 4,\n        }\n    }\n}\n\nimpl Argon2Hasher {\n    /// Create a new hasher with default parameters.\n    pub fn new() -\u003e Self {\n        Self::default()\n    }\n\n    /// Create a hasher with custom parameters.\n    ///\n    /// # Arguments\n    /// * `memory_cost` - Memory cost in KiB (minimum 8, must be power of 2)\n    /// * `iterations` - Number of iterations (minimum 1)\n    /// * `parallelism` - Parallelism factor (minimum 1)\n    pub fn with_params(memory_cost: u32, iterations: u32, parallelism: u32) -\u003e Self {\n        Self {\n            memory_cost,\n            iterations,\n            parallelism,\n        }\n    }\n\n    fn params(\u0026self) -\u003e Result\u003cargon2::Params, io::Error\u003e {\n        argon2::Params::new(self.memory_cost, self.iterations, self.parallelism, None).map_err(\n            |e| {\n                io::Error::new(\n                    io::ErrorKind::InvalidInput,\n                    format!(\"Invalid Argon2 parameters: {e}\"),\n                )\n            },\n        )\n    }\n}\n\nimpl PasswordHasherExt for Argon2Hasher {\n    fn hash_password(\u0026self, password: \u0026[u8]) -\u003e Result\u003cString, io::Error\u003e {\n        let argon2 = Argon2::new(\n            argon2::Algorithm::Argon2id,\n            argon2::Version::V0x13,\n            self.params()?,\n        );\n\n        let password_hash = argon2.hash_password(password).map_err(|e| {\n            io::Error::new(\n                io::ErrorKind::Other,\n                format!(\"Failed to hash password: {}\", e),\n            )\n        })?;\n\n        Ok(password_hash.to_string())\n    }\n\n    fn needs_rehash(\u0026self, hash: \u0026str) -\u003e bool {\n        match PasswordHash::new(hash) {\n            Ok(parsed) =\u003e {\n                if parsed.algorithm.as_str() != \"argon2id\" {\n                    return true;\n                }\n\n                // Argon2 v0x13 == decimal 19.\n                if parsed.version != Some(0x13) {\n                    return true;\n                }\n\n                if parsed.salt.is_none() || parsed.hash.is_none() {\n                    return true;\n                }\n\n                let memory_cost_str = parsed.params.get(\"m\").map(|v| v.as_str());\n                let iterations_str = parsed.params.get(\"t\").map(|v| v.as_str());\n                let parallelism_str = parsed.params.get(\"p\").map(|v| v.as_str());\n\n                let memory_cost = memory_cost_str.and_then(|v| v.parse().ok()).unwrap_or(0);\n                let iterations = iterations_str.and_then(|v| v.parse().ok()).unwrap_or(0);\n                let parallelism = parallelism_str.and_then(|v| v.parse().ok()).unwrap_or(0);\n\n                memory_cost != self.memory_cost\n                    || iterations != self.iterations\n                    || parallelism != self.parallelism\n            }\n            Err(_) =\u003e true,\n        }\n    }\n}\n\nimpl PasswordVerifierExt for Argon2Hasher {\n    fn verify_password(\u0026self, password: \u0026[u8], hash: \u0026str) -\u003e Result\u003cbool, io::Error\u003e {\n        match PasswordHash::new(hash) {\n            Ok(parsed_hash) =\u003e {\n                let argon2 = Argon2::new(\n                    argon2::Algorithm::Argon2id,\n                    argon2::Version::V0x13,\n                    self.params()?,\n                );\n\n                let result = argon2.verify_password(password, \u0026parsed_hash);\n\n                match result {\n                    Ok(()) =\u003e Ok(true),\n                    Err(argon2::password_hash::Error::PasswordInvalid) =\u003e Ok(false),\n                    Err(e) =\u003e Err(io::Error::new(\n                        io::ErrorKind::Other,\n                        format!(\"Failed to verify password: {}\", e),\n                    )),\n                }\n            }\n            Err(e) =\u003e Err(io::Error::new(\n                io::ErrorKind::Other,\n                format!(\"Failed to parse password hash: {}\", e),\n            )),\n        }\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn hash_is_nondeterministic_and_verifies() {\n        let hasher = Argon2Hasher::new();\n        let password = b\"correct horse battery staple\";\n\n        let h1 = hasher.hash_password(password).unwrap();\n        let h2 = hasher.hash_password(password).unwrap();\n\n        assert_ne!(h1, h2);\n        assert!(hasher.verify_password(password, \u0026h1).unwrap());\n        assert!(hasher.verify_password(password, \u0026h2).unwrap());\n        assert!(!hasher.verify_password(b\"wrong\", \u0026h1).unwrap());\n\n        // Verifying should use parameters from the PHC string, not the current hasher params.\n        let weaker = Argon2Hasher::with_params(32768, 2, 2);\n        assert!(weaker.verify_password(password, \u0026h1).unwrap());\n    }\n\n    #[test]\n    fn needs_rehash_detects_algorithm_and_params() {\n        let hasher = Argon2Hasher::new();\n        let password = b\"password\";\n        let hash = hasher.hash_password(password).unwrap();\n\n        assert!(!hasher.needs_rehash(\u0026hash));\n\n        let mutated_alg = hash.replacen(\"$argon2id$\", \"$argon2i$\", 1);\n        assert!(hasher.needs_rehash(\u0026mutated_alg));\n\n        let weaker = Argon2Hasher::with_params(32768, 2, 4);\n        assert!(weaker.needs_rehash(\u0026hash));\n    }\n}\n","traces":[{"line":33,"address":[],"length":0,"stats":{"Line":6}},{"line":44,"address":[],"length":0,"stats":{"Line":6}},{"line":45,"address":[],"length":0,"stats":{"Line":6}},{"line":54,"address":[],"length":0,"stats":{"Line":2}},{"line":62,"address":[],"length":0,"stats":{"Line":14}},{"line":63,"address":[],"length":0,"stats":{"Line":84}},{"line":64,"address":[],"length":0,"stats":{"Line":0}},{"line":65,"address":[],"length":0,"stats":{"Line":0}},{"line":66,"address":[],"length":0,"stats":{"Line":0}},{"line":67,"address":[],"length":0,"stats":{"Line":0}},{"line":75,"address":[],"length":0,"stats":{"Line":6}},{"line":77,"address":[],"length":0,"stats":{"Line":6}},{"line":78,"address":[],"length":0,"stats":{"Line":6}},{"line":79,"address":[],"length":0,"stats":{"Line":12}},{"line":82,"address":[],"length":0,"stats":{"Line":30}},{"line":83,"address":[],"length":0,"stats":{"Line":0}},{"line":84,"address":[],"length":0,"stats":{"Line":0}},{"line":85,"address":[],"length":0,"stats":{"Line":0}},{"line":89,"address":[],"length":0,"stats":{"Line":6}},{"line":92,"address":[],"length":0,"stats":{"Line":3}},{"line":93,"address":[],"length":0,"stats":{"Line":3}},{"line":94,"address":[],"length":0,"stats":{"Line":3}},{"line":95,"address":[],"length":0,"stats":{"Line":3}},{"line":96,"address":[],"length":0,"stats":{"Line":1}},{"line":100,"address":[],"length":0,"stats":{"Line":2}},{"line":101,"address":[],"length":0,"stats":{"Line":0}},{"line":104,"address":[],"length":0,"stats":{"Line":8}},{"line":105,"address":[],"length":0,"stats":{"Line":0}},{"line":108,"address":[],"length":0,"stats":{"Line":12}},{"line":109,"address":[],"length":0,"stats":{"Line":12}},{"line":110,"address":[],"length":0,"stats":{"Line":12}},{"line":112,"address":[],"length":0,"stats":{"Line":14}},{"line":113,"address":[],"length":0,"stats":{"Line":14}},{"line":114,"address":[],"length":0,"stats":{"Line":14}},{"line":116,"address":[],"length":0,"stats":{"Line
