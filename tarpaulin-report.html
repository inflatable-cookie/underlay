_trait;\nuse std::sync::Arc;\nuse underlay_core::Uuid;\n\nuse underlay_auth::{AuthError, Credential, CredentialMetadata, User, UserStatus};\n\nuse crate::errors::{PasswordAuthError, PasswordAuthResult};\nuse crate::hasher::{PasswordHasherExt, PasswordVerifierExt};\nuse crate::strength::PasswordStrengthAnalyzer;\n\n/// Configuration for password authentication.\n#[derive(Debug, Clone)]\npub struct PasswordConfig {\n    /// Maximum failed login attempts before lockout.\n    pub max_failed_attempts: u32,\n    /// Lockout duration in seconds.\n    pub lockout_duration_seconds: u64,\n    /// Rate limit window in seconds.\n    pub rate_limit_window_seconds: u64,\n    /// Maximum attempts per rate limit window.\n    pub rate_limit_max_attempts: u32,\n    /// Minimum password length.\n    pub min_password_length: usize,\n    /// Whether to check compromised passwords.\n    pub check_compromised: bool,\n    /// Strategy for checking if a password is compromised.\n    pub compromised_password_strategy: CompromisedPasswordStrategy,\n}\n\nimpl Default for PasswordConfig {\n    fn default() -\u003e Self {\n        Self {\n            max_failed_attempts: 5,\n            lockout_duration_seconds: 900,\n            rate_limit_window_seconds: 3600,\n            rate_limit_max_attempts: 10,\n            min_password_length: 8,\n            check_compromised: false,\n            compromised_password_strategy: CompromisedPasswordStrategy::LocalBlocklist,\n        }\n    }\n}\n\n/// Strategy for compromised-password checks.\n#[derive(Debug, Clone)]\npub enum CompromisedPasswordStrategy {\n    /// Offline-only: local blocklist of extremely common passwords.\n    ///\n    /// This is fast and has no network dependency, but does not detect all breached passwords.\n    LocalBlocklist,\n\n    /// Online (optional): HIBP Pwned Passwords k-anonymity range API.\n    ///\n    /// This sends only the first 5 hex chars of the SHA-1 password hash.\n    #[cfg(feature = \"hibp\")]\n    HibpKAnonymity {\n        /// Base URL for the API.\n        ///\n        /// Example: `https://api.pwnedpasswords.com`.\n        api_base_url: String,\n        /// User agent string for HTTP requests.\n        user_agent: String,\n    },\n}\n\n/// Repository for user and credential operations.\n#[async_trait]\npub trait PasswordAuthRepository: Send + Sync {\n    /// Find a user by email.\n    async fn find_user_by_email(\u0026self, email: \u0026str) -\u003e PasswordAuthResult\u003cOption\u003cUser\u003e\u003e;\n\n    /// Find a user by ID.\n    async fn find_user_by_id(\u0026self, user_id: Uuid) -\u003e PasswordAuthResult\u003cOption\u003cUser\u003e\u003e;\n\n    /// Find a password credential for a user.\n    async fn find_password_credential(\n        \u0026self,\n        user_id: Uuid,\n    ) -\u003e PasswordAuthResult\u003cOption\u003cCredential\u003e\u003e;\n\n    /// Create a password credential for a user.\n    async fn create_password_credential(\n        \u0026self,\n        user_id: Uuid,\n        password_hash: \u0026str,\n    ) -\u003e PasswordAuthResult\u003cCredential\u003e;\n\n    /// Update a password credential.\n    async fn update_password_credential(\n        \u0026self,\n        credential_id: Uuid,\n        password_hash: \u0026str,\n    ) -\u003e PasswordAuthResult\u003c()\u003e;\n\n    /// Delete a password credential.\n    async fn delete_password_credential(\n        \u0026self,\n        credential_id: Uuid,\n    ) -\u003e PasswordAuthResult\u003c()\u003e;\n\n    /// Record a failed login attempt.\n    ///\n    /// Implementations should increment failure counters and, when the threshold is reached,\n    /// apply a lockout and return the remaining lockout seconds.\n    async fn record_failed_login(\n        \u0026self,\n        user_id: Uuid,\n        max_failed_attempts: u32,\n        lockout_duration_seconds: u64,\n    ) -\u003e PasswordAuthResult\u003cFailedLoginAttempt\u003e;\n\n    /// Reset failed login attempts.\n    async fn reset_failed_logins(\n        \u0026self,\n        user_id: Uuid,\n    ) -\u003e PasswordAuthResult\u003c()\u003e;\n\n    /// Get failed login count for a user.\n    async fn get_failed_login_count(\n        \u0026self,\n        user_id: Uuid,\n    ) -\u003e PasswordAuthResult\u003cu32\u003e;\n\n    /// Returns remaining lockout seconds, or `None` if not locked out.\n    async fn get_lockout_remaining_seconds(\n        \u0026self,\n        user_id: Uuid,\n    ) -\u003e PasswordAuthResult\u003cOption\u003cu64\u003e\u003e;\n\n    /// Check rate limit for this key.\n    ///\n    /// Returns `(allowed, retry_after_seconds)`.\n    async fn check_rate_limit(\n        \u0026self,\n        key: \u0026str,\n        max_attempts: u32,\n        window_seconds: u64,\n    ) -\u003e PasswordAuthResult\u003c(bool, u64)\u003e;\n}\n\n/// Result of recording a failed login attempt.\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub struct FailedLoginAttempt {\n    pub count: u32,\n    pub lockout_remaining_seconds: Option\u003cu64\u003e,\n}\n\n/// Service for password-based authentication.\n#[derive(Debug, Clone)]\npub struct PasswordAuthService\u003cR, H, V\u003e\nwhere\n    R: PasswordAuthRepository,\n    H: PasswordHasherExt,\n    V: PasswordVerifierExt,\n{\n    repository: Arc\u003cR\u003e,\n    hasher: Arc\u003cH\u003e,\n    verifier: Arc\u003cV\u003e,\n    analyzer: Arc\u003cPasswordStrengthAnalyzer\u003e,\n    config: PasswordConfig,\n}\n\nimpl\u003cR, H, V\u003e PasswordAuthService\u003cR, H, V\u003e\nwhere\n    R: PasswordAuthRepository,\n    H: PasswordHasherExt,\n    V: PasswordVerifierExt,\n{\n    /// Create a new password auth service.\n    pub fn new(\n        repository: Arc\u003cR\u003e,\n        hasher: Arc\u003cH\u003e,\n        verifier: Arc\u003cV\u003e,\n        config: Option\u003cPasswordConfig\u003e,\n    ) -\u003e Self {\n        let config = config.unwrap_or_default();\n        let analyzer = PasswordStrengthAnalyzer::new().with_min_length(config.min_password_length);\n\n        Self {\n            repository,\n            hasher,\n            verifier,\n            analyzer: Arc::new(analyzer),\n            config,\n        }\n    }\n\n    async fn is_compromised_password(\u0026self, password: \u0026str) -\u003e PasswordAuthResult\u003cbool\u003e {\n        if !self.config.check_compromised {\n            return Ok(false);\n        }\n\n        match \u0026self.config.compromised_password_strategy {\n            CompromisedPasswordStrategy::LocalBlocklist =\u003e {\n                Ok(self.analyzer.is_common_password(password))\n            }\n            #[cfg(feature = \"hibp\")]\n            CompromisedPasswordStrategy::HibpKAnonymity {\n                api_base_url,\n                user_agent,\n            } =\u003e hibp_k_anonymity_check(password, api_base_url, user_agent).await,\n        }\n    }\n\n    /// Create or replace a user's password credential.\n    pub async fn set_password(\n        \u0026self,\n        user_id: Uuid,\n        password: \u0026str,\n    ) -\u003e PasswordAuthResult\u003cCredential\u003e {\n        let analysis = self.analyzer.analyze(password);\n\n        if self.is_compromised_password(password).await? {\n            return Err(PasswordAuthError::PasswordCompromised.into());\n        }\n\n        if analysis.strength \u003c crate::strength::PasswordStrength::Fair {\n            return Err(PasswordAuthError::PasswordTooWeak(analysis.feedback.join(\". \")).into());\n        }\n\n        let new_hash = self.hasher.hash_password(password.as_bytes())?;\n\n        if let Some(existing) = self.repository.find_password_credential(user_id).await? {\n            if self\n                .verifier\n                .verify_password(password.as_bytes(), \u0026existing.secret_encrypted)?\n            {\n                return Err(PasswordAuthError::PasswordSameAsCurrent.into());\n            }\n\n            self.repository\n                .update_password_credential(existing.id, \u0026new_hash)\n                .await?;\n\n            let updated = self\n                .repository\n                .find_password_credential(user_id)\n                .await?\n                .ok_or(PasswordAuthError::Internal(\n                    \"Password credential missing after update\".to_string(),\n                ))?;\n\n            Ok(updated)\n        } else {\n            self.repository\n                .create_password_credential(user_id, \u0026new_hash)\n                .await\n        }\n    }\n\n    /// Verify login credentials.\n    pub async fn verify_login(\u0026self, email: \u0026str, password: \u0026str) -\u003e PasswordAuthResult\u003cUser\u003e {\n        self.verify_login_with_context(email, password, None).await\n    }\n\n    /// Verify login credentials with an optional context (e.g. IP address).\n    pub async fn verify_login_with_context(\n        \u0026self,\n        email: \u0026str,\n        password: \u0026str,\n        ip: Option\u003c\u0026str\u003e,\n    ) -\u003e PasswordAuthResult\u003cUser\u003e {\n        let normalized_email = email.trim().to_lowercase();\n        let rate_limit_key = match ip {\n            Some(ip) =\u003e format!(\"login:{}:{}\", normalized_email, ip),\n            None =\u003e format!(\"login:{}\", normalized_email),\n        };\n\n        let (allowed, retry_after_seconds) = self\n            .repository\n            .check_rate_limit(\n                \u0026rate_limit_key,\n                self.config.rate_limit_max_attempts,\n                self.config.rate_limit_window_seconds,\n            )\n            .await?;\n        if !allowed {\n            return Err(PasswordAuthError::RateLimited {\n                retry_after_seconds,\n            }\n            .into());\n        }\n\n        let user = match self.repository.find_user_by_email(email).await? {\n            Some(u) =\u003e u,\n            None =\u003e return Err(PasswordAuthError::CredentialNotFound),\n        };\n\n        if user.status == UserStatus::Suspended {\n            return Err(AuthError::AccountSuspended.into());\n        }\n        if user.status == UserStatus::Deleted {\n            return Err(AuthError::AccountDeleted.into());\n        }\n\n        if let Some(retry_after_seconds) = self\n            .repository\n            .get_lockout_remaining_seconds(user.id)\n            .await?\n        {\n            return Err(\n                PasswordAuthError::AccountLocked {\n                    retry_after_seconds,\n                }\n                .into(),\n            );\n        }\n\n        let credential = match self\n            .repository\n            .find_password_credential(user.id)\n            .await?\n        {\n            Some(c) =\u003e c,\n            None =\u003e return Err(PasswordAuthError::CredentialNotFound),\n        };\n\n        let password_hash = match \u0026credential.metadata {\n            CredentialMetadata::Password { .. } =\u003e {\n                \u0026credential.secret_encrypted\n            }\n            _ =\u003e {\n                return Err(PasswordAuthError::Internal(\n                    \"Invalid credential type\".to_string(),\n                ).into());\n            }\n        };\n\n        let is_valid = self\n            .verifier\n            .verify_password(password.as_bytes(), password_hash)?;\n\n        if is_valid {\n            self.repository.reset_failed_logins(user.id).await?;\n            Ok(user)\n        } else {\n            let attempt = self\n                .repository\n                .record_failed_login(\n                    user.id,\n                    self.config.max_failed_attempts,\n                    self.config.lockout_duration_seconds,\n                )\n                .await?;\n\n            if let Some(retry_after_seconds) = attempt.lockout_remaining_seconds {\n                Err(\n                    PasswordAuthError::AccountLocked {\n                        retry_after_seconds,\n                    }\n                    .into(),\n                )\n            } else if attempt.count \u003e= self.config.max_failed_attempts {\n                Err(\n                    PasswordAuthError::AccountLocked {\n                        retry_after_seconds: self.config.lockout_duration_seconds,\n                    }\n                    .into(),\n                )\n            } else {\n                Err(PasswordAuthError::WrongPassword)\n            }\n        }\n    }\n\n    /// Change a user's password.\n    pub async fn change_password(\n        \u0026self,\n        user_id: Uuid,\n        current_password: \u0026str,\n        new_password: \u0026str,\n    ) -\u003e PasswordAuthResult\u003c()\u003e {\n        let analysis = self.analyzer.analyze(new_password);\n\n        if self.is_compromised_password(new_password).await? {\n            return Err(PasswordAuthError::PasswordCompromised.into());\n        }\n\n        if analysis.strength \u003c crate::strength::PasswordStrength::Fair {\n            return Err(PasswordAuthError::PasswordTooWeak(analysis.feedback.join(\". \")).into());\n        }\n\n        let credential = match self\n            .repository\n            .find_password_credential(user_id)\n            .await?\n        {\n            Some(c) =\u003e c,\n            None =\u003e return Err(PasswordAuthError::CredentialNotFound.into()),\n        };\n\n        let current_hash = \u0026credential.secret_encrypted;\n        let is_valid = self\n            .verifier\n            .verify_password(current_password.as_bytes(), current_hash)?;\n\n        if !is_valid {\n            return Err(PasswordAuthError::WrongPassword);\n        }\n\n        if self\n            .verifier\n            .verify_password(new_password.as_bytes(), current_hash)?\n        {\n            return Err(PasswordAuthError::PasswordSameAsCurrent.into());\n        }\n\n        let new_hash = self.hasher.hash_password(new_password.as_bytes())?;\n\n        self.repository\n            .update_password_credential(credential.id, \u0026new_hash)\n            .await?;\n\n        Ok(())\n    }\n\n    /// Reset a user's password (admin/internal use).\n    pub async fn reset_password(\n        \u0026self,\n        user_id: Uuid,\n        new_password: \u0026str,\n    ) -\u003e PasswordAuthResult\u003c()\u003e {\n        let analysis = self.analyzer.analyze(new_password);\n\n        if self.is_compromised_password(new_password).await? {\n            return Err(PasswordAuthError::PasswordCompromised.into());\n        }\n\n        if analysis.strength \u003c crate::strength::PasswordStrength::Fair {\n            return Err(PasswordAuthError::PasswordTooWeak(analysis.feedback.join(\". \")).into());\n        }\n\n        let credential = match self\n            .repository\n            .find_password_credential(user_id)\n            .await?\n        {\n            Some(c) =\u003e c,\n            None =\u003e return Err(PasswordAuthError::CredentialNotFound.into()),\n        };\n\n        let new_hash = self.hasher.hash_password(new_password.as_bytes())?;\n\n        self.repository\n            .update_password_credential(credential.id, \u0026new_hash)\n            .await?;\n\n        Ok(())\n    }\n}\n\n#[cfg(feature = \"hibp\")]\nasync fn hibp_k_anonymity_check(\n    password: \u0026str,\n    api_base_url: \u0026str,\n    user_agent: \u0026str,\n) -\u003e PasswordAuthResult\u003cbool\u003e {\n    use reqwest::header::HeaderValue;\n    use sha1::{Digest, Sha1};\n\n    let mut hasher = Sha1::new();\n    hasher.update(password.as_bytes());\n    let digest = hasher.finalize();\n\n    let mut hex = String::with_capacity(digest.len() * 2);\n    for b in digest {\n        hex.push_str(\u0026format!(\"{:02X}\", b));\n    }\n\n    let (prefix, suffix) = hex.split_at(5);\n\n    let base = api_base_url.trim_end_matches('/');\n    let url = format!(\"{}/range/{}\", base, prefix);\n\n    let client = reqwest::Client::builder()\n        .user_agent(user_agent)\n        .build()\n        .map_err(|e| PasswordAuthError::Internal(format!(\"failed to build HIBP client: {}\", e)))?;\n\n    let resp = client\n        .get(url)\n        // Request padding to reduce information disclosure.\n        .header(\"Add-Padding\", HeaderValue::from_static(\"true\"))\n        .send()\n        .await\n        .map_err(|e| PasswordAuthError::Internal(format!(\"HIBP request failed: {}\", e)))?;\n\n    if !resp.status().is_success() {\n        return Err(PasswordAuthError::Internal(format!(\n            \"HIBP returned {}\",\n            resp.status()\n        )));\n    }\n\n    let body = resp\n        .text()\n        .await\n        .map_err(|e| PasswordAuthError::Internal(format!(\"HIBP response read failed: {}\", e)))?;\n\n    Ok(hibp_range_body_contains_suffix(\u0026body, suffix))\n}\n\n#[cfg(feature = \"hibp\")]\nfn hibp_range_body_contains_suffix(body: \u0026str, suffix: \u0026str) -\u003e bool {\n    for line in body.lines() {\n        let line = line.trim();\n        if line.is_empty() {\n            continue;\n        }\n\n        let Some((candidate_suffix, _count)) = line.split_once(':') else {\n            continue;\n        };\n\n        if candidate_suffix.trim().eq_ignore_ascii_case(suffix) {\n            return true;\n        }\n    }\n    false\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n    use crate::hasher::Argon2Hasher;\n    use std::collections::{HashMap, HashSet};\n    use tokio::sync::Mutex;\n\n    #[derive(Debug)]\n        struct MemoryRepo {\n            users_by_email: Mutex\u003cHashMap\u003cString, User\u003e\u003e,\n            users_by_id: Mutex\u003cHashMap\u003cUuid, User\u003e\u003e,\n            credentials_by_user: Mutex\u003cHashMap\u003cUuid, Credential\u003e\u003e,\n            credential_ids: Mutex\u003cHashSet\u003cUuid\u003e\u003e,\n            failed_counts: Mutex\u003cHashMap\u003cUuid, u32\u003e\u003e,\n            locked_until: Mutex\u003cHashMap\u003cUuid, chrono::DateTime\u003cchrono::Utc\u003e\u003e\u003e,\n            blocked_rate_limit_keys: Mutex\u003cHashSet\u003cString\u003e\u003e,\n            lockout_threshold: u32,\n        }\n\n\n    impl MemoryRepo {\n        fn new(lockout_threshold: u32) -\u003e Self {\n            Self {\n                users_by_email: Mutex::new(HashMap::new()),\n                users_by_id: Mutex::new(HashMap::new()),\n                credentials_by_user: Mutex::new(HashMap::new()),\n                credential_ids: Mutex::new(HashSet::new()),\n                failed_counts: Mutex::new(HashMap::new()),\n                locked_until: Mutex::new(HashMap::new()),\n                blocked_rate_limit_keys: Mutex::new(HashSet::new()),\n                lockout_threshold,\n            }\n        }\n\n        async fn insert_user(\u0026self, user: User) {\n            self.users_by_email\n                .lock()\n                .await\n                .insert(user.email.clone(), user.clone());\n            self.users_by_id.lock().await.insert(user.id, user);\n        }\n\n        async fn block_rate_limit_key(\u0026self, key: String) {\n            self.blocked_rate_limit_keys.lock().await.insert(key);\n        }\n    }\n\n    #[async_trait]\n    impl PasswordAuthRepository for MemoryRepo {\n        async fn find_user_by_email(\u0026self, email: \u0026str) -\u003e PasswordAuthResult\u003cOption\u003cUser\u003e\u003e {\n            Ok(self.users_by_email.lock().await.get(email).cloned())\n        }\n\n        async fn find_user_by_id(\u0026self, user_id: Uuid) -\u003e PasswordAuthResult\u003cOption\u003cUser\u003e\u003e {\n            Ok(self.users_by_id.lock().await.get(\u0026user_id).cloned())\n        }\n\n        async fn find_password_credential(\n            \u0026self,\n            user_id: Uuid,\n        ) -\u003e PasswordAuthResult\u003cOption\u003cCredential\u003e\u003e {\n            Ok(self.credentials_by_user.lock().await.get(\u0026user_id).cloned())\n        }\n\n        async fn create_password_credential(\n            \u0026self,\n            user_id: Uuid,\n            password_hash: \u0026str,\n        ) -\u003e PasswordAuthResult\u003cCredential\u003e {\n            let now = chrono::Utc::now();\n            let cred = Credential {\n                id: Uuid::new_v7(),\n                user_id,\n                credential_type: underlay_auth::CredentialType::Password,\n                secret_encrypted: password_hash.to_string(),\n                metadata: CredentialMetadata::Password {\n                    algorithm: \"argon2id\".to_string(),\n                    memory_kb: 65536,\n                    iterations: 3,\n                    parallelism: 4,\n                },\n                verified: true,\n                created_at: now,\n                updated_at: now,\n                last_used_at: None,\n            };\n\n            self.credential_ids.lock().await.insert(cred.id);\n            self.credentials_by_user.lock().await.insert(user_id, cred.clone());\n            Ok(cred)\n        }\n\n        async fn update_password_credential(\n            \u0026self,\n            credential_id: Uuid,\n            password_hash: \u0026str,\n        ) -\u003e PasswordAuthResult\u003c()\u003e {\n            if !self.credential_ids.lock().await.contains(\u0026credential_id) {\n                return Err(PasswordAuthError::CredentialNotFound);\n            }\n\n            let mut creds = self.credentials_by_user.lock().await;\n            let (user_id, mut cred) = creds\n                .iter()\n                .find(|(_, c)| c.id == credential_id)\n                .map(|(k, v)| (*k, v.clone()))\n                .ok_or(PasswordAuthError::CredentialNotFound)?;\n\n            cred.secret_encrypted = password_hash.to_string();\n            cred.updated_at = chrono::Utc::now();\n            creds.insert(user_id, cred);\n            Ok(())\n        }\n\n        async fn delete_password_credential(\u0026self, credential_id: Uuid) -\u003e PasswordAuthResult\u003c()\u003e {\n            self.credential_ids.lock().await.remove(\u0026credential_id);\n            let mut creds = self.credentials_by_user.lock().await;\n            creds.retain(|_, c| c.id != credential_id);\n            Ok(())\n        }\n\n        async fn record_failed_login(\n            \u0026self,\n            user_id: Uuid,\n            max_failed_attempts: u32,\n            lockout_duration_seconds: u64,\n        ) -\u003e PasswordAuthResult\u003cFailedLoginAttempt\u003e {\n            let mut counts = self.failed_counts.lock().await;\n            let entry = counts.entry(user_id).or_insert(0);\n            *entry += 1;\n            let count = *entry;\n\n            let threshold = std::cmp::min(self.lockout_threshold, max_failed_attempts);\n            let lockout_remaining_seconds = if count \u003e= threshold {\n                let until = chrono::Utc::now()\n                    + chrono::Duration::seconds(lockout_duration_seconds as i64);\n                self.locked_until.lock().await.insert(user_id, until);\n                Some(lockout_duration_seconds)\n            } else {\n                None\n            };\n\n            Ok(FailedLoginAttempt {\n                count,\n                lockout_remaining_seconds,\n            })\n        }\n\n        async fn reset_failed_logins(\u0026self, user_id: Uuid) -\u003e PasswordAuthResult\u003c()\u003e {\n            self.failed_counts.lock().await.remove(\u0026user_id);\n            self.locked_until.lock().await.remove(\u0026user_id);\n            Ok(())\n        }\n\n        async fn get_failed_login_count(\u0026self, user_id: Uuid) -\u003e PasswordAuthResult\u003cu32\u003e {\n            Ok(*self.failed_counts.lock().await.get(\u0026user_id).unwrap_or(\u00260))\n        }\n\n        async fn get_lockout_remaining_seconds(\n            \u0026self,\n            user_id: Uuid,\n        ) -\u003e PasswordAuthResult\u003cOption\u003cu64\u003e\u003e {\n            let mut locked_until = self.locked_until.lock().await;\n            let Some(until) = locked_until.get(\u0026user_id).copied() else {\n                return Ok(None);\n            };\n\n            let now = chrono::Utc::now();\n            if until \u003c= now {\n                locked_until.remove(\u0026user_id);\n                return Ok(None);\n            }\n\n            let secs = (until - now).num_seconds();\n            Ok(Some(secs.max(1) as u64))\n        }\n\n        async fn check_rate_limit(\n            \u0026self,\n            key: \u0026str,\n            _max_attempts: u32,\n            _window_seconds: u64,\n        ) -\u003e PasswordAuthResult\u003c(bool, u64)\u003e {\n            if self.blocked_rate_limit_keys.lock().await.contains(key) {\n                Ok((false, 60))\n            } else {\n                Ok((true, 0))\n            }\n        }\n    }\n\n    fn make_user(email: \u0026str) -\u003e User {\n        let now = chrono::Utc::now();\n        User {\n            id: Uuid::new_v7(),\n            email: email.to_string(),\n            display_name: \"Test\".to_string(),\n            status: UserStatus::Active,\n            created_at: now,\n            updated_at: now,\n        }\n    }\n\n    #[tokio::test]\n    async fn login_success_resets_failures() {\n        let user = make_user(\"a@example.com\");\n        let repo = Arc::new(MemoryRepo::new(10));\n        repo.insert_user(user.clone()).await;\n\n        let hasher = Arc::new(Argon2Hasher::new());\n        let verifier = hasher.clone();\n\n        let service = PasswordAuthService::new(\n            repo.clone(),\n            hasher,\n            verifier,\n            Some(PasswordConfig {\n                max_failed_attempts: 10,\n                ..PasswordConfig::default()\n            }),\n        );\n\n        service.set_password(user.id, \"S0mething$trong!\").await.unwrap();\n\n        let err = service.verify_login(\u0026user.email, \"wrong\").await.unwrap_err();\n        assert!(matches!(err, PasswordAuthError::WrongPassword));\n\n        let ok = service\n            .verify_login(\u0026user.email, \"S0mething$trong!\")\n            .await\n            .unwrap();\n        assert_eq!(ok.id, user.id);\n\n        assert_eq!(repo.get_failed_login_count(user.id).await.unwrap(), 0);\n        assert!(repo.get_lockout_remaining_seconds(user.id).await.unwrap().is_none());\n    }\n\n    #[tokio::test]\n    async fn lockout_triggers_after_n_failures() {\n        let user = make_user(\"b@example.com\");\n        let repo = Arc::new(MemoryRepo::new(2));\n        repo.insert_user(user.clone()).await;\n\n        let hasher = Arc::new(Argon2Hasher::new());\n        let verifier = hasher.clone();\n\n        let service = PasswordAuthService::new(\n            repo.clone(),\n            hasher,\n            verifier,\n            Some(PasswordConfig {\n                max_failed_attempts: 2,\n                lockout_duration_seconds: 900,\n                ..PasswordConfig::default()\n            }),\n        );\n\n        service.set_password(user.id, \"S0mething$trong!\").await.unwrap();\n\n        let err1 = service.verify_login(\u0026user.email, \"wrong\").await.unwrap_err();\n        assert!(matches!(err1, PasswordAuthError::WrongPassword));\n\n        let err2 = service.verify_login(\u0026user.email, \"wrong\").await.unwrap_err();\n        assert!(matches!(err2, PasswordAuthError::AccountLocked { .. }));\n\n        // Subsequent attempts are blocked by get_lockout_remaining_seconds().\n        let err3 = service\n            .verify_login(\u0026user.email, \"S0mething$trong!\")\n            .await\n            .unwrap_err();\n        assert!(matches!(err3, PasswordAuthError::AccountLocked { .. }));\n    }\n\n    #[tokio::test]\n    async fn rate_limit_blocks_login_attempts() {\n        let user = make_user(\"c@example.com\");\n        let repo = Arc::new(MemoryRepo::new(10));\n        repo.insert_user(user.clone()).await;\n\n        let hasher = Arc::new(Argon2Hasher::new());\n        let verifier = hasher.clone();\n\n        let service = PasswordAuthService::new(repo.clone(), hasher, verifier, None);\n\n        service.set_password(user.id, \"S0mething$trong!\").await.unwrap();\n\n        let ip = \"1.2.3.4\";\n        let key = format!(\"login:{}:{}\", user.email.trim().to_lowercase(), ip);\n        repo.block_rate_limit_key(key).await;\n\n        let err = service\n            .verify_login_with_context(\u0026user.email, \"S0mething$trong!\", Some(ip))\n            .await\n            .unwrap_err();\n        assert!(matches!(err, PasswordAuthError::RateLimited { .. }));\n    }\n\n    #[tokio::test]\n    async fn compromised_password_rejected_when_enabled() {\n        let user = make_user(\"d@example.com\");\n        let repo = Arc::new(MemoryRepo::new(10));\n        repo.insert_user(user.clone()).await;\n\n        let hasher = Arc::new(Argon2Hasher::new());\n        let verifier = hasher.clone();\n\n        let service = PasswordAuthService::new(\n            repo,\n            hasher,\n            verifier,\n            Some(PasswordConfig {\n                check_compromised: true,\n                compromised_password_strategy: CompromisedPasswordStrategy::LocalBlocklist,\n                ..PasswordConfig::default()\n            }),\n        );\n\n        let err = service.set_password(user.id, \"password123\").await.unwrap_err();\n        assert!(matches!(err, PasswordAuthError::PasswordCompromised));\n    }\n}\n","traces":[{"line":33,"address":[],"length":0,"stats":{"Line":4}},{"line":172,"address":[],"length":0,"stats":{"Line":4}},{"line":178,"address":[],"length":0,"stats":{"Line":12}},{"line":179,"address":[],"length":0,"stats":{"Line":16}},{"line":185,"address":[],"length":0,"stats":{"Line":8}},{"line":190,"address":[],"length":0,"stats":{"Line":8}},{"line":191,"address":[],"length":0,"stats":{"Line":4}},{"line":192,"address":[],"length":0,"stats":{"Line":3}},{"line":195,"address":[],"length":0,"stats":{"Line":1}},{"line":196,"address":[],"length":0,"stats":{"Line":0}},{"li trength.rs"],"content":"//! Password strength analysis and validation.\n\nuse std::collections::HashSet;\n\nuse zxcvbn::zxcvbn;\n\n/// Password strength levels.\n#[derive(Debug, Clone, Copy, PartialEq, Eq, PartialOrd, Ord)]\npub enum PasswordStrength {\n    /// Very weak - fails most requirements.\n    VeryWeak,\n    /// Weak - meets minimum length but low complexity.\n    Weak,\n    /// Fair - meets basic complexity requirements.\n    Fair,\n    /// Good - meets all standard requirements.\n    Good,\n    /// Strong - exceeds requirements with high entropy.\n    Strong,\n}\n\n/// Analysis of password strength.\n#[derive(Debug, Clone)]\npub struct PasswordAnalysis {\n    /// Overall strength rating.\n    pub strength: PasswordStrength,\n    /// Minimum required length (8).\n    pub min_length: usize,\n    /// Actual password length.\n    pub length: usize,\n    /// Whether password has lowercase letters.\n    pub has_lowercase: bool,\n    /// Whether password has uppercase letters.\n    pub has_uppercase: bool,\n    /// Whether password has digits.\n    pub has_digits: bool,\n    /// Whether password has special characters.\n    pub has_special: bool,\n    /// Number of unique characters.\n    pub unique_chars: usize,\n    /// Whether password is in the common passwords list.\n    pub is_common: bool,\n    /// Estimated entropy in bits.\n    pub entropy_bits: f64,\n    /// Feedback messages.\n    pub feedback: Vec\u003cString\u003e,\n}\n\n/// Analyzer for password strength.\n#[derive(Debug, Clone)]\npub struct PasswordStrengthAnalyzer {\n    /// Minimum password length.\n    min_length: usize,\n    /// Common passwords to reject.\n    common_passwords: HashSet\u003c\u0026'static str\u003e,\n}\n\nimpl Default for PasswordStrengthAnalyzer {\n    fn default() -\u003e Self {\n        Self::new()\n    }\n}\n\nimpl PasswordStrengthAnalyzer {\n    /// Check if a password is in the local common-passwords blocklist.\n    pub fn is_common_password(\u0026self, password: \u0026str) -\u003e bool {\n        let normalized = password.trim().to_ascii_lowercase();\n        self.common_passwords.contains(normalized.as_str())\n    }\n\n    /// Create a new analyzer with default settings.\n    pub fn new() -\u003e Self {\n        let mut common_passwords = HashSet::new();\n        let common_list = [\n            \"password\",\n            \"123456\",\n            \"123456789\",\n            \"12345678\",\n            \"12345\",\n            \"1234567\",\n            \"qwerty\",\n            \"abc123\",\n            \"monkey\",\n            \"1234567890\",\n            \"letmein\",\n            \"trustno1\",\n            \"dragon\",\n            \"baseball\",\n            \"iloveyou\",\n            \"master\",\n            \"sunshine\",\n            \"ashley\",\n            \"bailey\",\n            \"passw0rd\",\n            \"shadow\",\n            \"123123\",\n            \"654321\",\n            \"superman\",\n            \"qazwsx\",\n            \"michael\",\n            \"football\",\n            \"password1\",\n            \"password123\",\n            \"batman\",\n            \"login\",\n            \"admin\",\n            \"welcome\",\n            \"hello\",\n            \"charlie\",\n            \"donald\",\n            \"qwerty123\",\n            \"password!\",\n            \"admin123\",\n            \"root\",\n            \"toor\",\n            \"jesus\",\n            \"password1!\",\n            \"secret\",\n            \"access\",\n            \"mustang\",\n            \"george\",\n            \"thomas\",\n            \"hockey\",\n            \"ranger\",\n            \"daniel\",\n            \"jordan\",\n            \"ginger\",\n            \"buster\",\n            \"summer\",\n            \"tigger\",\n            \"robert\",\n            \"soccer\",\n            \"harley\",\n            \"liverpool\",\n            \"manutd\",\n            \"arsenal\",\n            \"chelsea\",\n        ];\n        common_passwords.extend(common_list);\n\n        Self {\n            min_length: 8,\n            common_passwords,\n        }\n    }\n\n    /// Create an analyzer with custom minimum length.\n    pub fn with_min_length(mut self, min_length: usize) -\u003e Self {\n        self.min_length = min_length;\n        self\n    }\n\n    /// Add common passwords to the blocklist.\n    pub fn add_common_passwords(mut self, passwords: \u0026[\u0026'static str]) -\u003e Self {\n        self.common_passwords.extend(passwords);\n        self\n    }\n\n    /// Analyze a password and return its strength.\n    pub fn analyze(\u0026self, password: \u0026str) -\u003e PasswordAnalysis {\n        let length = password.len();\n        let has_lowercase = password.chars().any(|c| c.is_ascii_lowercase());\n        let has_uppercase = password.chars().any(|c| c.is_ascii_uppercase());\n        let has_digits = password.chars().any(|c| c.is_ascii_digit());\n        let has_special = password\n            .chars()\n            .any(|c| !c.is_ascii_alphanumeric() \u0026\u0026 !c.is_whitespace());\n        let unique_chars = password.chars().collect::\u003cHashSet\u003c_\u003e\u003e().len();\n        let is_common = self.is_common_password(password);\n\n        // Prefer zxcvbn score for overall strength.\n        // It is more robust than composition rules (and is still fully offline).\n        let (zxcvbn_score, zxcvbn_guesses, zxcvbn_feedback) = match zxcvbn(password, \u0026[]) {\n            Ok(entropy) =\u003e (\n                entropy.score() as u8,\n                entropy.guesses(),\n                match entropy.feedback() {\n                    Some(f) =\u003e {\n                        let mut msgs = Vec::new();\n                        if let Some(w) = f.warning() {\n                            msgs.push(w.to_string());\n                        }\n                        for s in f.suggestions() {\n                            msgs.push(s.to_string());\n                        }\n                        msgs\n                    }\n                    None =\u003e Vec::new(),\n                },\n            ),\n            Err(_) =\u003e (0, 0_u64, Vec::new()),\n        };\n\n        // Rough entropy estimate from guesses; not perfect but useful as an informational metric.\n        let entropy_bits = if zxcvbn_guesses \u003e 0 {\n            (zxcvbn_guesses as f64).log2()\n        } else {\n            0.0\n        };\n\n        let mut feedback = Vec::new();\n        if length \u003c self.min_length {\n            feedback.push(format!(\n                \"Password must be at least {} characters\",\n                self.min_length\n            ));\n        }\n        feedback.extend(zxcvbn_feedback);\n\n        let strength = if is_common {\n            PasswordStrength::VeryWeak\n        } else if length \u003c self.min_length {\n            PasswordStrength::VeryWeak\n        } else {\n            match zxcvbn_score {\n                0 =\u003e PasswordStrength::VeryWeak,\n                1 =\u003e PasswordStrength::Weak,\n                2 =\u003e PasswordStrength::Fair,\n                3 =\u003e PasswordStrength::Good,\n                _ =\u003e PasswordStrength::Strong,\n            }\n        };\n\n        PasswordAnalysis {\n            strength,\n            min_length: self.min_length,\n            length,\n            has_lowercase,\n            has_uppercase,\n            has_digits,\n            has_special,\n            unique_chars,\n            is_common,\n            entropy_bits,\n            feedback,\n        }\n    }\n\n    /// Validate a password and return Ok if valid, or an error message.\n    pub fn validate(\u0026self, password: \u0026str) -\u003e Result\u003cPasswordAnalysis, String\u003e {\n        let analysis = self.analyze(password);\n\n        if analysis.is_common {\n            return Err(\"Password is too common\".to_string());\n        }\n\n        if analysis.strength \u003c PasswordStrength::Good {\n            if let Some(msg) = analysis.feedback.first() {\n                return Err(msg.clone());\n            }\n            return Err(\"Password is too weak\".to_string());\n        }\n\n        Ok(analysis)\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use super::*;\n\n    #[test]\n    fn very_short_password_rejected() {\n        let analyzer = PasswordStrengthAnalyzer::new();\n        let result = analyzer.analyze(\"abc\");\n\n        assert_eq!(result.strength, PasswordStrength::VeryWeak);\n        assert!(result.feedback.iter().any(|f| f.contains(\"at least\")));\n    }\n\n    #[test]\n    fn common_password_rejected() {\n        let analyzer = PasswordStrengthAnalyzer::new();\n\n        for common in [\"password\", \"123456\", \"admin\", \"qwerty\"] {\n            let result = analyzer.analyze(common);\n            assert!(result.is_common);\n            assert_eq!(result.strength, PasswordStrength::VeryWeak);\n        }\n    }\n\n    #[test]\n    fn is_common_password_case_insensitive() {\n        let analyzer = PasswordStrengthAnalyzer::new();\n\n        assert!(analyzer.is_common_password(\"PASSWORD\"));\n        assert!(analyzer.is_common_password(\"Password\"));\n        assert!(analyzer.is_common_password(\"PaSsWoRd\"));\n    }\n\n    #[test]\n    fn strength_levels_order_correctly() {\n        assert!(PasswordStrength::VeryWeak \u003c PasswordStrength::Weak);\n        assert!(PasswordStrength::Weak \u003c PasswordStrength::Fair);\n        assert!(PasswordStrength::Fair \u003c PasswordStrength::Good);\n        assert!(PasswordStrength::Good \u003c PasswordStrength::Strong);\n    }\n\n    #[test]\n    fn strong_password_has_all_features() {\n        let analyzer = PasswordStrengthAnalyzer::new();\n        let result = analyzer.analyze(\"S3cur3P@ssw0rd!\");\n\n        assert!(result.has_lowercase);\n        assert!(result.has_uppercase);\n        assert!(result.has_digits);\n        assert!(result.has_special);\n        assert!(result.length \u003e= 8);\n        assert!(!result.is_common);\n onfig.database_url)\n        .await\n}\n\n#[cfg(test)]\nmod tests {\n    use super::DbConfig;\n\n    #[test]\n    fn db_config_default_max_connections() {\n        let config = DbConfig::new(\"postgres://localhost/test\");\n        assert_eq!(config.max_connections, 10);\n    }\n\n    #[test]\n    fn db_config_with_custom_max_connections() {\n        let config = DbConfig {\n            database_url: \"postgres://localhost/test\".to_string(),\n            max_connections: 50,\n        };\n        assert_eq!(config.max_connections, 50);\n    }\n\n    #[test]\n    fn db_config_stores_database_url() {\n        let url = \"postgres://localhost:5432/mydb\";\n        let config = DbConfig::new(url);\n        assert_eq!(config.database_url, url);\n    }\n\n    #[test]\n    fn db_config_from_string() {\n        let config = DbConfig::new(\"postgresql://user:pass@localhost/db\");\n        assert_eq!(config.database_url, \"postgresql://user:pass@localhost/db\");\n    }\n\n    #[test]\n    fn db_config_clone_works() {\n        let config = DbConfig::new(\"postgres://localhost/test\");\n        let cloned = config.clone();\n        assert_eq!(cloned.database_url, config.database_url);\n        assert_eq!(cloned.max_connections, config.max_connections);\n    }\n\n    #[test]\n    fn db_config_debug_contains_relevant_info() {\n        let config = DbConfig::new(\"postgres://user:secretpassword@localhost/test\");\n        let debug_str = format!(\"{:?}\", config);\n        assert!(debug_str.contains(\"postgres://user:\"));\n        assert!(debug_str.contains(\"test\"));\n    }\n}\n","traces":[{"line":13,"address":[],"length":0,"stats":{"Line":5}},{"line":15,"address":[],"length":0,"stats":{"Line":5}},{"line":21,"address":[],"length":0,"stats":{"Line":0}},{"line":22,"address":[],"length":0,"stats":{"Line":0}},{"line":23,"address":[],"length":0,"stats":{"Line":0}},{"line":24,"address":[],"length":0,"stats":{"Line":0}},{"line":25,"address":[],"length":0,"stats":{"Line":0}}],"covered" "DROP SCHEMA IF EXISTS {schema} CASCADE\");\n        sqlx::query(\u0026sql).execute(pool).await?;\n    }\n\n    Ok(())\n}\n\n#[cfg(test)]\nmod tests {\n    use super::{validate_schema_name, DestructiveGuard};\n\n    #[test]\n    fn schema_validation_allows_simple_names() {\n        assert!(validate_schema_name(\"learning\"));\n        assert!(validate_schema_name(\"infra\"));\n        assert!(validate_schema_name(\"content_library\"));\n        assert!(validate_schema_name(\"_private\"));\n    }\n\n    #[test]\n    fn schema_validation_rejects_mixed_case_and_symbols() {\n        assert!(!validate_schema_name(\"Learning\"));\n        assert!(!validate_schema_name(\"learning; drop schema public\"));\n        assert!(!validate_schema_name(\"learning-content\"));\n        assert!(!validate_schema_name(\"learning.content\"));\n        assert!(!validate_schema_name(\"\"));\n        assert!(!validate_schema_name(\" \"));\n    }\n\n    #[test]\n    fn destructive_guard_defaults_to_disallowed() {\n        let guard = DestructiveGuard::disallow();\n        assert!(!guard.is_allowed());\n    }\n\n    #[test]\n    fn destructive_guard_can_be_allowed() {\n        let guard = DestructiveGuard::allow();\n        assert!(guard.is_allowed());\n    }\n\n    #[test]\n    fn schema_validation_allows_underscore_prefix() {\n        assert!(validate_schema_name(\"_test\"));\n        assert!(validate_schema_name(\"_my_schema\"));\n    }\n\n    #[test]\n    fn schema_validation_allows_numbers_after_first_char() {\n        assert!(validate_schema_name(\"schema1\"));\n        assert!(validate_schema_name(\"learning2content\"));\n        assert!(validate_schema_name(\"_private123\"));\n    }\n\n    #[test]\n    fn schema_validation_rejects_uppercase() {\n        assert!(!validate_schema_name(\"PUBLIC\"));\n        assert!(!validate_schema_name(\"Learning\"));\n        assert!(!validate_schema_name(\"My_Schema\"));\n    }\n\n    #[test]\n    fn schema_validation_rejects_hyphen() {\n        assert!(!validate_schema_name(\"learning-content\"));\n        assert!(!validate_schema_name(\"my-schema\"));\n    }\n\n    #[test]\n    fn schema_validation_rejects_dot() {\n        assert!(!validate_schema_name(\"learning.content\"));\n        assert!(!validate_schema_name(\"schema.table\"));\n    }\n\n    #[test]\n    fn schema_validation_rejects_special_chars() {\n        assert!(!validate_schema_name(\"learning@content\"));\n        assert!(!validate_schema_name(\"schema#table\"));\n        assert!(!validate_schema_name(\"test$schema\"));\n    }\n\n    #[test]\n    fn schema_validation_rejects_whitespace() {\n        assert!(!validate_schema_name(\"learning content\"));\n        assert!(!validate_schema_name(\"\\t\\n\"));\n        assert!(!validate_schema_name(\"a b c\"));\n    }\n\n    #[test]\n    fn schema_validation_trims_leading_trailing() {\n        assert!(validate_schema_name(\"  learning\"));\n        assert!(validate_schema_name(\"learning  \"));\n        assert!(validate_schema_name(\"  learning  \"));\n    }\n}\n","traces":[{"line":9,"address":[],"length":0,"stats":{"Line":1}},{"line":13,"address":[],"length":0,"stats":{"Line":1}},{"line":17,"address":[],"length":0,"stats":{"Line":2}},{"line":18,"address":[],"length":0,"stats":{"Line":2}},{"line":26,"address":[],"length":0,"stats":{"Line":31}},{"line":27,"address":[],"length":0,"stats":{"Line":93}},{"line":28,"address":[],"length":0,"stats":{"Line":62}},{"line":29,"address":[],"length":0,"stats":{"Line":3}},{"line":32,"address":[],"length":0,"stats":{"Line":84}},{"line":33,"address":[],"length":0,"stats":{"Line":56}},{"line":34,"address":[],"length":0,"stats":{"Line":0}},{"line":37,"address":[],"length":0,"stats":{"Line":64}},{"line":38,"address":[],"length":0,"stats":{"Line":4}},{"line":41,"address":[],"length":0,"stats":{"Line":356}},{"line":42,"address":[],"length":0,"stats":{"Line":396}},{"line":43,"address":[],"length":0,"stats":{"Line":12}},{"line":47,"address":[],"length":0,"stats":{"Line":12}},{ igrate::MigrateError) -\u003e Self {\n        Self::Migrate(value)\n    }\n}\n\npub fn require_env(name: \u0026'static str) -\u003e Result\u003cString, DevtoolError\u003e {\n    std::env::var(name).map_err(|_| DevtoolError::MissingEnvVar { name })\n}\n\npub async fn connect(database_url: \u0026str) -\u003e Result\u003cDbPool, DevtoolError\u003e {\n    let config = DbConfig::new(database_url);\n    Ok(underlay_db::create_pool(\u0026config).await?)\n}\n\npub async fn migrate(\n    pool: \u0026DbPool,\n    migrator: \u0026sqlx::migrate::Migrator,\n) -\u003e Result\u003c(), DevtoolError\u003e {\n    underlay_db::run_migrations(pool, migrator).await?;\n    Ok(())\n}\n\npub async fn migrate_with(\n    pool: \u0026DbPool,\n    migrate: impl for\u003c'a\u003e Fn(\u0026'a DbPool) -\u003e MigrateFuture\u003c'a\u003e,\n) -\u003e Result\u003c(), DevtoolError\u003e {\n    migrate(pool).await?;\n    Ok(())\n}\n\npub async fn reset_schemas\u003cS, I\u003e(\n    pool: \u0026DbPool,\n    schemas: I,\n    recreate_public: bool,\n    allow_destructive: bool,\n) -\u003e Result\u003c(), DevtoolError\u003e\nwhere\n    I: IntoIterator\u003cItem = S\u003e,\n    S: AsRef\u003cstr\u003e,\n{\n    let guard = if allow_destructive {\n        DestructiveGuard::allow()\n    } else {\n        DestructiveGuard::disallow()\n    };\n\n    underlay_db::drop_schemas(pool, guard, schemas).await?;\n\n    if recreate_public {\n        sqlx::query(\"CREATE SCHEMA public;\").execute(pool).await?;\n    }\n\n    Ok(())\n}\n\npub async fn migrate_from_env(\n    database_url_env: \u0026'static str,\n    migrator: \u0026sqlx::migrate::Migrator,\n) -\u003e Result\u003cDbPool, DevtoolError\u003e {\n    let database_url = require_env(database_url_env)?;\n    let pool = connect(\u0026database_url).await?;\n    migrate(\u0026pool, migrator).await?;\n    Ok(pool)\n}\n\npub async fn migrate_from_env_with(\n    database_url_env: \u0026'static str,\n    migrate: impl for\u003c'a\u003e Fn(\u0026'a DbPool) -\u003e MigrateFuture\u003c'a\u003e,\n) -\u003e Result\u003cDbPool, DevtoolError\u003e {\n    let database_url = require_env(database_url_env)?;\n    let pool = connect(\u0026database_url).await?;\n    migrate_with(\u0026pool, migrate).await?;\n    Ok(pool)\n}\n\npub async fn reset_from_env\u003cS, I\u003e(\n    database_url_env: \u0026'static str,\n    schemas: I,\n    recreate_public: bool,\n    allow_destructive: bool,\n) -\u003e Result\u003c(), DevtoolError\u003e\nwhere\n    I: IntoIterator\u003cItem = S\u003e,\n    S: AsRef\u003cstr\u003e,\n{\n    let database_url = require_env(database_url_env)?;\n    let pool = connect(\u0026database_url).await?;\n    reset_schemas(\u0026pool, schemas, recreate_public, allow_destructive).await?;\n    Ok(())\n}\n","traces":[{"line":17,"address":[],"length":0,"stats":{"Line":0}},{"line":18,"address":[],"length":0,"stats":{"Line":0}},{"line":19,"address":[],"length":0,"stats":{"Line":0}},{"line":20,"address":[],"length":0,"stats":{"Line":0}},{"line":22,"address":[],"length":0,"stats":{"Line":0}},{"line":23,"address":[],"length":0,"stats":{"Line":0}},{"line":31,"address":[],"length":0,"stats":{"Line":0}},{"line":32,"address":[],"length":0,"stats":{"Line":0}},{"line":37,"address":[],"length":0,"stats":{"Line":0}},{"line":38,"address":[],"length":0,"stats":{"Line":0}},{"line":42,"address":[],"length":0,"stats":{"Line":0}},{"line":43,"address":[],"length":0,"stats":{"Line":0}},{"line":46,"address":[],"length":0,"stats":{"Line":0}},{"line":47,"address":[],"length":0,"stats":{"Line":0}},{"line":48,"address":[],"length":0,"stats":{"Line":0}},{"line":51,"address":[],"length":0,"stats":{"Line":0}},{"line":55,"address":[],"length":0,"stats":{"Line":0}},{"line":56,"address":[],"length":0,"stats":{"Line":0}},{"line":59,"address":[],"length":0,"stats":{"Line":0}},{"line":63,"address":[],"length":0,"stats":{"Line":0}},{"line":64,"address":[],"length":0,"stats":{"Line":0}},{"line":67,"address":[],"length":0,"stats":{"Line":0}},{"line":77,"address":[],"length" ring,\n    pub payload: Value,\n    pub occurred_at: DateTime\u003cUtc\u003e,\n}\n\nimpl NewDomainEvent {\n    pub fn now(event_type: impl Into\u003cString\u003e, payload: Value) -\u003e Self {\n        Self {\n            event_type: event_type.into(),\n            payload,\n            occurred_at: Utc::now(),\n        }\n    }\n}\n\n/// An app-owned storage implementation for persisting domain events.\n///\n/// Underlay provides the contract and recommended schema; applications provide\n/// concrete implementations (e.g. SQLx/Postgres).\n#[async_trait]\npub trait DomainEventWriter: Send + Sync {\n    type Error: std::error::Error + Send + Sync + 'static;\n\n    async fn append(\u0026self, event: NewDomainEvent) -\u003e Result\u003cUuid, Self::Error\u003e;\n}\n\n#[cfg(test)]\nmod tests {\n    use super::{DomainEvent, NewDomainEvent, DOMAIN_EVENTS_SQL};\n    use chrono::{TimeZone, Utc};\n    use serde_json::json;\n\n    #[test]\n    fn schema_template_is_present() {\n        assert!(!DOMAIN_EVENTS_SQL.trim().is_empty());\n        let lowered = DOMAIN_EVENTS_SQL.to_ascii_lowercase();\n        assert!(lowered.contains(\"create table\"));\n    }\n\n    #[test]\n    fn new_domain_event_now_sets_expected_fields() {\n        let payload = serde_json::json!({\"ok\": true});\n        let before = chrono::Utc::now();\n        let event = super::NewDomainEvent::now(\"test.event\", payload.clone());\n        let after = chrono::Utc::now();\n\n        assert_eq!(event.event_type, \"test.event\");\n        assert_eq!(event.payload, payload);\n        assert!(event.occurred_at \u003e= before);\n        assert!(event.occurred_at \u003c= after);\n    }\n\n    #[test]\n    fn domain_event_type_has_required_fields() {\n        let id = underlay_core::Uuid::new_v7();\n        let occurred = Utc.timestamp_opt(1700000000, 0).unwrap();\n        let processed = Utc.timestamp_opt(1700000100, 0).unwrap();\n\n        let event = DomainEvent {\n            id,\n            event_type: \"user.created\".to_string(),\n            payload: json!({\"user_id\": \"abc123\"}),\n            occurred_at: occurred,\n            processed_at: Some(processed),\n        };\n\n        assert_eq!(event.id, id);\n        assert_eq!(event.event_type, \"user.created\");\n        assert!(event.processed_at.is_some());\n    }\n\n    #[test]\n    fn domain_event_with_null_processed_at() {\n        let event = DomainEvent {\n            id: underlay_core::Uuid::new_v7(),\n            event_type: \"test\".to_string(),\n            payload: json!({}),\n            occurred_at: Utc::now(),\n            processed_at: None,\n        };\n\n        assert!(event.processed_at.is_none());\n    }\n\n    #[test]\n    fn domain_event_serialize_roundtrip() {\n        let original = DomainEvent {\n            id: underlay_core::Uuid::new_v7(),\n            event_type: \"test.event\".to_string(),\n            payload: json!({\"nested\": {\"key\": \"value\"}}),\n            occurred_at: Utc::now(),\n            processed_at: None,\n        };\n\n        let serialized = serde_json::to_string(\u0026original).unwrap();\n        let deserialized: DomainEvent = serde_json::from_str(\u0026serialized).unwrap();\n\n        assert_eq!(original.id, deserialized.id);\n        assert_eq!(original.event_type, deserialized.event_type);\n        assert_eq!(original.payload, deserialized.payload);\n    }\n\n    #[test]\n    fn new_domain_event_from_parts() {\n        let payload = json!({\"key\": 123});\n        let occurred = Utc::now();\n\n        let event = NewDomainEvent {\n            event_type: \"custom.event\".to_string(),\n            payload: payload.clone(),\n            occurred_at: occurred,\n        };\n\n        assert_eq!(event.event_type, \"custom.event\");\n        assert_eq!(event.payload, payload);\n        assert_eq!(event.occurred_at, occurred);\n    }\n\n    #[test]\n    fn domain_event_debug_format() {\n        let event = DomainEvent {\n            id: underlay_core::Uuid::new_v7(),\n            event_type: \"debug.test\".to_string(),\n            payload: json!({}),\n            occurred_at: Utc::now(),\n            processed_at: None,\n        };\n\n        let debug_str = format!(\"{:?}\", event);\n        assert!(debug_str.contains(\"DomainEvent\"));\n        assert!(debug_str.contains(\"debug.test\"));\n    }\n\n    #[test]\n    fn new_domain_event_debug_format() {\n        let event = NewDomainEvent::now(\"debug.event\", json!({}));\n        let debug_str = format!(\"{:?}\", event);\n        assert!(debug_str.contains(\"NewDomainEvent\"));\n    }\n\n    #[test]\n    fn domain_event_traits() {\n        fn assert_send\u003cT: Send\u003e() {}\n        fn assert_sync\u003cT: Sync\u003e() {}\n        assert_send::\u003cDomainEvent\u003e();\n        assert_sync::\u003cDomainEvent\u003e();\n        assert_send::\u003cNewDomainEvent\u003e();\n        assert_sync::\u003cNewDomainEvent\u003e();\n    }\n\n    #[test]\n    fn domain_event_implements_clone() {\n        let event1 = DomainEvent {\n            id: underlay_core::Uuid::new_v7(),\n            event_type: \"clone.test\".to_string(),\n            payload: json!({\"cloned\": true}),\n            occurred_at: Utc::now(),\n            processed_at: None,\n        };\n\n        let event2 = event1.clone();\n        assert_eq!(event1.id, event2.id);\n        assert_eq!(event1.event_type, event2.event_type);\n    }\n\n    #[test]\n    fn complex_payload_serialization() {\n        let payload = json!({\n            \"users\": [\n                {\"id\": 1, \"name\": \"Alice\"},\n                {\"id\": 2, \"name\": \"Bob\"}\n            ],\n            \"metadata\": {\n                \"version\": \"1.0\",\n                \"tags\": [\"tag1\", \"tag2\"]\n            }\n        });\n\n        let event = NewDomainEvent::now(\"complex.event\", payload.clone());\n        assert_eq!(event.payload, payload);\n    }\n}\n","traces":[{"line":31,"address":[],"length":0,"stats":{"Line":3}},{"line":33," t TestHandler;\n\n    #[async_trait]\n    impl JobHandler for TestHandler {\n        fn job_type(\u0026self) -\u003e \u0026'static str {\n            \"test\"\n        }\n\n        async fn handle(\u0026self, _job: Job) -\u003e Result\u003c(), JobHandlerError\u003e {\n            Ok(())\n        }\n    }\n\n    #[test]\n    fn registry_tracks_registered_job_types_and_handler_lookup() {\n        let mut registry = JobRegistry::new();\n        registry.register(TestHandler);\n\n        let types = registry.job_types();\n        assert_eq!(types, vec![\"test\".to_string()]);\n\n        assert!(registry.handler(\"test\").is_some());\n        assert!(registry.handler(\"missing\").is_none());\n    }\n}\n","traces":[{"line":12,"address":[],"length":0,"stats":{"Line":1}},{"line":13,"address":[],"length":0,"stats":{"Line":3}},{"line":14,"address":[],"length":0,"stats":{"Line":3}},{"line":20,"address":[],"length":0,"stats":{"Line":6}},{"line":22,"address":[],"length":0,"stats":{"Line":6}},{"line":26,"address":[],"length":0,"stats":{"Line":3}},{"line":30,"address":[],"length":0,"stats":{"Line":3}},{"line":31,"address":[],"length":0,"stats":{"Line":12}},{"line":34,"address":[],"length":0,"stats":{"Line":6}},{"line":35,"address":[],"length":0,"stats":{"Line":24}},{"line":38,"address":[],"length":0,"stats":{"Line":4}},{"line":39,"address":[],"length":0,"stats":{"Line":16}}],"covered":12,"coverable":12},{"path":["/","Users","betterthanclay","Dev","libraries","underlay","rust","crates","underlay-jobs","src","runner.rs"],"content":"use std::time::Duration;\n\nuse crate::{JobRegistry, JobStore};\n\n#[derive(Debug, Clone)]\npub struct JobRunnerConfig {\n    pub poll_interval: Duration,\n}\n\nimpl Default for JobRunnerConfig {\n    fn default() -\u003e Self {\n        Self {\n            poll_interval: Duration::from_millis(250),\n        }\n    }\n}\n\n#[derive(Debug)]\npub struct JobRunner\u003cS\u003e {\n    store: S,\n    registry: JobRegistry,\n    config: JobRunnerConfig,\n}\n\nimpl\u003cS\u003e JobRunner\u003cS\u003e\nwhere\n    S: JobStore,\n{\n    pub fn new(store: S, registry: JobRegistry) -\u003e Self {\n        Self {\n            store,\n            registry,\n            config: JobRunnerConfig::default(),\n        }\n    }\n\n    pub fn with_config(mut self, config: JobRunnerConfig) -\u003e Self {\n        self.config = config;\n        self\n    }\n\n    pub async fn run_once(\u0026self) -\u003e Result\u003cbool, S::Error\u003e {\n        let allowed = self.registry.job_types();\n        let Some(job) = self.store.fetch_next(\u0026allowed).await? else {\n            return Ok(false);\n        };\n\n        let Some(handler) = self.registry.handler(\u0026job.job_type) else {\n            // Not our job; treat as not processed.\n            return Ok(false);\n        };\n\n        match handler.handle(job.clone()).await {\n            Ok(()) =\u003e {\n                self.store.mark_success(job.id).await?;\n                Ok(true)\n            }\n            Err(err) =\u003e {\n                self.store.mark_failure(job.id, err).await?;\n                Ok(true)\n            }\n        }\n    }\n\n    pub async fn run_forever(\u0026self) -\u003e Result\u003c(), S::Error\u003e {\n        loop {\n            let did_work = self.run_once().await?;\n            if !did_work {\n                tokio::time::sleep(self.config.poll_interval).await;\n            }\n        }\n    }\n}\n\n#[cfg(test)]\nmod tests {\n    use std::sync::{Arc, Mutex};\n\n    use async_trait::async_trait;\n    use serde_json::json;\n\n    use crate::{Job, JobHandler, JobHandlerError, JobId, JobRegistry, JobRunner, JobRunnerConfig, JobStore};\n\n    #[derive(Debug, Default)]\n    struct MemStore {\n        queue: Mutex\u003cVec\u003cJob\u003e\u003e,\n        successes: Mutex\u003cVec\u003cJobId\u003e\u003e,\n        failures: Mutex\u003cVec\u003cJobId\u003e\u003e,\n    }\n\n    #[derive(Debug)]\n    struct MemError;\n\n    impl std::fmt::Display for MemError {\n        fn fmt(\u0026self, f: \u0026mut std::fmt::Formatter\u003c'_\u003e) -\u003e std::fmt::Result {\n            write!(f, \"mem error\")\n        }\n    }\n\n    impl std::error::Error for MemError {}\n\n    #[async_trait]\n    impl JobStore for Arc\u003cMemStore\u003e {\n        type Error = MemError;\n\n        async fn fetch_next(\u0026self, allowed_types: \u0026[String]) -\u003e Result\u003cOption\u003cJob\u003e, Self::Error\u003e {\n            let mut q = self.queue.lock().unwrap();\n            let idx = q\n                .iter()\n                .position(|j| allowed_types.iter().any(|t| t == \u0026j.job_type));\n            Ok(idx.map(|i| q.remove(i)))\n        }\n\n        async fn mark_success(\u0026self, job_id: JobId) -\u003e Result\u003c(), Self::Error\u003e {\n            self.successes.lock().unwrap().push(job_id);\n            Ok(())\n        }\n\n        async fn mark_failure(\n            \u0026self,\n            job_id: JobId,\n            _error: JobHandlerError,\n        ) -\u003e Result\u003c(), Self::Error\u003e {\n            self.failures.lock().unwrap().push(job_id);\n            Ok(())\n        }\n    }\n\n    #[derive(Debug)]\n    struct TestHandler;\n\n    #[async_trait]\n    impl JobHandler for TestHandler {\n        fn job_type(\u0026self) -\u003e \u0026'static str {\n            \"test\"\n        }\n\n        async fn handle(\u0026self, _job: Job) -\u003e Result\u003c(), JobHandlerError\u003e {\n            Ok(())\n        }\n    }\n\n    #[tokio::test]\n    async fn runner_dispatches_jobs_to_registered_handler() {\n        let store = Arc::new(MemStore::default());\n\n        let id = underlay_core::Uuid::new_v7();\n        store.queue.lock().unwrap().push(Job {\n            id,\n            job_type: \"test\".to_string(),\n            payload: serde_json::json!({\"ok\": true}),\n            attempts: 0,\n        });\n\n        let mut registry = JobRegistry::new();\n        registry.register(TestHandler);\n\n        let runner nt of the refresh token.\n    pub refresh_token_fingerprint: \u0026'a str,\n    /// When the access token expires.\n    pub access_token_expires_at: chrono::DateTime\u003cchrono::Utc\u003e,\n    /// When the refresh token expires.\n    pub refresh_token_expires_at: chrono::DateTime\u003cchrono::Utc\u003e,\n    /// Client IP address.\n    pub ip_address: Option\u003c\u0026'a str\u003e,\n    /// Client user agent.\n    pub user_agent: Option\u003c\u0026'a str\u003e,\n}\n\n/// Result type for repository operations.\npub type RepoResult\u003cT\u003e = Result\u003cT, AuthError\u003e;\n\n/// Repository trait for user operations.\n#[async_trait]\npub trait UserRepository: Send + Sync {\n    /// Find a user by ID.\n    async fn find_by_id(\u0026self, user_id: Uuid) -\u003e RepoResult\u003cOption\u003cUser\u003e\u003e;\n\n    /// Find a user by email.\n    async fn find_by_email(\u0026self, email: \u0026str) -\u003e RepoResult\u003cOption\u003cUser\u003e\u003e;\n\n    /// Create a new user.\n    async fn create(\n        \u0026self,\n        email: \u0026str,\n        display_name: \u0026str,\n    ) -\u003e RepoResult\u003cUser\u003e;\n\n    /// Update a user's status.\n    async fn update_status(\n        \u0026self,\n        user_id: Uuid,\n        status: UserStatus,\n    ) -\u003e RepoResult\u003c()\u003e;\n\n    /// Delete a user (soft delete).\n    async fn delete(\u0026self, user_id: Uuid) -\u003e RepoResult\u003c()\u003e;\n\n    /// Check if email is available.\n    async fn email_available(\u0026self, email: \u0026str) -\u003e RepoResult\u003cbool\u003e;\n}\n\n/// Repository trait for credential operations.\n#[async_trait]\npub trait CredentialRepository: Send + Sync {\n    /// Find a credential by ID.\n    async fn find_by_id(\n        \u0026self,\n        credential_id: Uuid,\n    ) -\u003e RepoResult\u003cOption\u003cCredential\u003e\u003e;\n\n    /// Find all credentials for a user.\n    async fn find_by_user_id(\n        \u0026self,\n        user_id: Uuid,\n    ) -\u003e RepoResult\u003cVec\u003cCredential\u003e\u003e;\n\n    /// Find a password credential for a user.\n    async fn find_password_by_user_id(\n        \u0026self,\n        user_id: Uuid,\n    ) -\u003e RepoResult\u003cOption\u003cCredential\u003e\u003e;\n\n    /// Find a TOTP credential for a user.\n    async fn find_totp_by_user_id(\n        \u0026self,\n        user_id: Uuid,\n    ) -\u003e RepoResult\u003cOption\u003cCredential\u003e\u003e;\n\n    /// Find PassKey credentials for a user.\n    async fn find_passkeys_by_user_id(\n        \u0026self,\n        user_id: Uuid,\n    ) -\u003e RepoResult\u003cVec\u003cCredential\u003e\u003e;\n\n    /// Find OAuth connection for a user and provider.\n    async fn find_oauth_by_user_and_provider(\n        \u0026self,\n        user_id: Uuid,\n        provider: CredentialType,\n    ) -\u003e RepoResult\u003cOption\u003cCredential\u003e\u003e;\n\n    /// Create a new credential.\n    async fn create(\n        \u0026self,\n        user_id: Uuid,\n        credential_type: CredentialType,\n        secret_encrypted: \u0026str,\n        metadata: \u0026CredentialMetadata,\n    ) -\u003e RepoResult\u003cCredential\u003e;\n\n    /// Update a credential's verified status.\n    async fn set_verified(\n        \u0026self,\n        credential_id: Uuid,\n        verified: bool,\n    ) -\u003e RepoResult\u003c()\u003e;\n\n    /// Update last used timestamp.\n    async fn update_last_used(\n        \u0026self,\n        credential_id: Uuid,\n    ) -\u003e RepoResult\u003c()\u003e;\n\n    /// Delete a credential.\n    async fn delete(\u0026self, credential_id: Uuid) -\u003e RepoResult\u003c()\u003e;\n\n    /// Delete all credentials for a user.\n    async fn delete_all_for_user(\u0026self, user_id: Uuid) -\u003e RepoResult\u003c()\u003e;\n}\n\n/// Repository trait for session operations.\n#[async_trait]\npub trait SessionRepository: Send + Sync {\n    /// Find a session by ID.\n    async fn find_by_id(\n        \u0026self,\n        session_id: Uuid,\n    ) -\u003e RepoResult\u003cOption\u003cSession\u003e\u003e;\n\n    /// Find a session by access token fingerprint.\n    async fn find_by_access_fingerprint(\n        \u0026self,\n        fingerprint: \u0026str,\n    ) -\u003e RepoResult\u003cOption\u003cSession\u003e\u003e;\n\n    /// Find a session by refresh token fingerprint.\n    async fn find_by_refresh_fingerprint(\n        \u0026self,\n        fingerprint: \u0026str,\n    ) -\u003e RepoResult\u003cOption\u003cSession\u003e\u003e;\n\n    /// Find all active sessions for a user.\n    async fn find_active_by_user_id(\n        \u0026self,\n        user_id: Uuid,\n    ) -\u003e RepoResult\u003cVec\u003cSession\u003e\u003e;\n\n    /// Create a new session.\n    async fn create(\u0026self, session: NewSession\u003c'_\u003e) -\u003e RepoResult\u003cSession\u003e;\n\n    /// Update last used timestamp.\n    async fn update_last_used(\n        \u0026self,\n        session_id: Uuid,\n    ) -\u003e RepoResult\u003c()\u003e;\n\n    /// Refresh a session (rotate tokens).\n    async fn refresh(\n        \u0026self,\n        session_id: Uuid,\n        new_access_fingerprint: \u0026str,\n        new_refresh_fingerprint: \u0026str,\n        new_access_expires_at: chrono::DateTime\u003cchrono::Utc\u003e,\n        new_refresh_expires_at: chrono::DateTime\u003cchrono::Utc\u003e,\n    ) -\u003e RepoResult\u003cSession\u003e;\n\n    /// Revoke a session.\n    async fn revoke(\n        \u0026self,\n        session_id: Uuid,\n        reason: \u0026str,\n    ) -\u003e RepoResult\u003c()\u003e;\n\n    /// Revoke all sessions for a user.\n    async fn revoke_all_for_user(\n        \u0026self,\n        user_id: Uuid,\n        reason: \u0026str,\n        exclude_session_id: Option\u003cUuid\u003e,\n    ) -\u003e RepoResult\u003c()\u003e;\n\n    /// Clean up expired sessions.\n    async fn clean_expired(\u0026self) -\u003e RepoResult\u003cu64\u003e;\n}\n\n/// Repository trait for audit log operations.\n#[async_trait]\npub trait AuditLogRepository: Send + Sync {\n    /// Create an audit log entry.\n    async fn create(\u0026self, event: \u0026AuthEvent) -\u003e RepoResult\u003c()\u003e;\n\n    /// Find audit log entries for a user.\n    async fn find_by_user_id(\n        \u0026self,\n        user_id: Uuid,\n        limit: u64,\n    ) -\u003e RepoResult\u003cVec\u003cAuthEvent\u003e\u003e;\n\n    /// Find audit log entries by IP address.\n    async fn find_by_ip_address(\n        \u0026self,\n        ip_address: \u0026str,\n        limit: u64,\n    ) -\u003e RepoResult\u003cVec\u003cAuthEvent\u003e\u003e;\n\n    /// Find failed login attempts for a user.\n    async fn find_failed_logins(\n        \u0026self,\n        user_id: Uuid,\n        since: chrono::DateTime\u003cchrono::Utc\u003e,\n        limit: u64,\n    ) -\u003e RepoResult\u003cVec\u003cAuthEvent\u003e\u003e;\n\n    /// Count events by type for a user.\n    async fn count_by_type_and_user(\n        \u0026self,\n        event_type: AuthEventType,\n        user_id: Uuid,\n        since: chrono::DateTime\u003cchrono::Utc\u003e,\n    ) -\u003e RepoResult\u003cu64\u003e;\n}\n\n/// Repository trait for rate limiting.\n#[async_trait]\npub trait RateLimitRepository: Send + Sync {\n    /// Check if a key is rate limited.\n    async fn is_rate_limited(\n        \u0026self,\n        key: \u0026str,\n        max_count: u64,\n        window_seconds: u64,\n    ) -\u003e RepoResult\u003c(bool, u64)\u003e;\n\n    /// Increment a rate limit counter.\n    async fn increment(\u0026self, key: \u0026str, window_seconds: u64) -\u003e RepoResult\u003cu64\u003e;\n\n    /// Reset a rate limit for a key.\n    async fn reset(\u0026self, key: \u0026str) -\u003e RepoResult\u003c()\u003e;\n}\n\n/// Composite repository for all auth operations.\n///\n/// Applications can implement this trait to provide a unified repository,\n/// or implement individual traits separately.\n#[async_trait]\npub trait AuthRepository:\n    UserRepository\n    + CredentialR
