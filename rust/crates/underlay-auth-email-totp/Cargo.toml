[package]
name = "underlay-auth-email-totp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Email-based OTP verification for Underlay auth"

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
rand = "0.10.1"
thiserror = "2"
tracing = { workspace = true }
underlay-auth = { path = "../underlay-auth", features = ["hashing"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
