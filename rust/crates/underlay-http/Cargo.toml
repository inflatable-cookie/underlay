[package]
name = "underlay-http"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = "0.7"
http = { workspace = true }
serde = { workspace = true }
serde_json = "1"
tower-http = { workspace = true, features = ["cors"] }
underlay-core = { path = "../underlay-core" }
underlay-observability = { path = "../underlay-observability" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
