[package]
name = "underlay-http"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
serde_json = "1"
sha2 = { workspace = true }
hex = { workspace = true }
thiserror = { workspace = true }
underlay-query = { path = "../underlay-query" }
tower-http = { workspace = true, features = ["cors"] }
underlay-core = { path = "../underlay-core" }
underlay-observability = { path = "../underlay-observability" }
uuid = { workspace = true, features = ["v7"] }

# Optional tracing integration
tracing = { workspace = true, optional = true }

# Optional database error logging
underlay-db = { path = "../underlay-db", optional = true }
sqlx = { workspace = true, optional = true, features = ["macros", "postgres", "uuid", "chrono", "json"] }
chrono = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync"] }
urlencoding = { version = "2.1" }

# Optional embed metadata proxy
underlay-http-client = { workspace = true, optional = true }

# Optional OpenAPI schema types
utoipa = { workspace = true, optional = true }

[features]
default = []
tracing = ["dep:tracing"]
error-logging = ["underlay-db", "sqlx", "chrono", "tokio/rt", "tracing"]
embed = ["underlay-http-client"]
openapi = ["dep:utoipa"]
opentelemetry = ["underlay-observability/opentelemetry"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time"] }
serde_urlencoded = "0.7"
tower = { workspace = true, features = ["util"] }
underlay-testing = { path = "../underlay-testing", features = ["db"] }

[lints]
workspace = true
