[package]
name = "underlay-http"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
serde_json = "1"
tower-http = { workspace = true, features = ["cors"] }
underlay-core = { path = "../underlay-core" }
underlay-observability = { path = "../underlay-observability" }
uuid = { workspace = true, features = ["v7"] }

# Optional tracing integration
tracing = { workspace = true, optional = true }

# Optional validation integration
validator = { version = "0.20", optional = true }

# Optional Nightfire content validation
underlay-nightfire = { path = "../underlay-nightfire", optional = true }

# Optional database error logging
underlay-db = { path = "../underlay-db", optional = true }
sqlx = { workspace = true, optional = true, features = ["macros", "postgres", "uuid", "chrono", "json"] }
chrono = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt"], optional = true }
urlencoding = { version = "2.1" }

# Optional embed metadata proxy
underlay-http-client = { workspace = true, optional = true }

# Optional OpenAPI schema types
utoipa = { workspace = true, optional = true }

[features]
default = []
tracing = ["dep:tracing"]
validation = ["dep:validator"]
nightfire = ["underlay-nightfire"]
error-logging = ["underlay-db", "sqlx", "chrono", "tokio", "tracing"]
embed = ["underlay-http-client"]
openapi = ["dep:utoipa"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
serde_urlencoded = "0.7"
tower = { workspace = true, features = ["util"] }
underlay-testing = { path = "../underlay-testing", features = ["db"] }
