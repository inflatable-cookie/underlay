[package]
name = "underlay-media"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Media library types and repository for Underlay applications"

[features]
default = []
postgres = ["sqlx"]
renditions = ["underlay-blob", "tracing"]
nightfire = ["underlay-nightfire"]
full = ["postgres", "renditions", "nightfire"]

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

# Image processing
image = { workspace = true }

# Re-export enums from underlay-db
underlay-db = { path = "../underlay-db" }
underlay-nightfire = { path = "../underlay-nightfire", optional = true }

# PostgreSQL support (optional)
sqlx = { workspace = true, optional = true }

# Rendition generation (optional)
underlay-blob = { path = "../underlay-blob", optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
