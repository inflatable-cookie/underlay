[package]
name = "underlay-validation"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Declarative validation with derive macros for Underlay"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
regex = { workspace = true }

# Re-export derive macro
underlay-validation-derive = { path = "../underlay-validation-derive", optional = true }

# Optional axum integration
axum = { workspace = true, optional = true }
http = { workspace = true, optional = true }

# Optional validator crate compatibility
validator = { version = "0.20", optional = true }
underlay-core = { path = "../underlay-core", optional = true }
uuid = { workspace = true, optional = true }

# Optional nightfire content validation
underlay-nightfire = { path = "../underlay-nightfire", optional = true }

# Optional slugify conversion (deunicode for unicode transliteration)
deunicode = { version = "1.6", optional = true }

[features]
default = ["derive"]
derive = ["underlay-validation-derive"]
axum = ["dep:axum", "dep:http"]
validator-compat = ["dep:validator", "dep:underlay-core"]
nightfire = ["dep:underlay-nightfire", "dep:underlay-core"]
field-validation = ["dep:uuid"]
slugify = ["dep:deunicode"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
