[package]
name = "underlay-auth-webauthn"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
 serde = { workspace = true, features = ["derive"] }
 serde_json = { workspace = true }
 thiserror = { workspace = true }
 url = { workspace = true }
 base64urlsafedata = "0.5.4"
 tracing = { workspace = true }
 webauthn-rs = { version = "0.5.4", features = ["conditional-ui"] }
 underlay-auth = { path = "../underlay-auth" }
 underlay-core = { path = "../underlay-core" }


[features]
# `webauthn-rs` treats state serialisation as dangerous; we keep it opt-in.
danger-allow-state-serialisation = ["webauthn-rs/danger-allow-state-serialisation"]

# Support attested passkeys and CA verification.
attestation = ["webauthn-rs/attestation"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
