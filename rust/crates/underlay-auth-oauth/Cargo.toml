[package]
name = "underlay-auth-oauth"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = "2"
url = "2"
async-trait = { workspace = true }

aes-gcm = "0.10"
base64 = "0.22"

# OAuth2 protocol + PKCE helpers.
oauth2 = { version = "5.0.0", features = ["reqwest"] }

# HTTP client used by oauth2's reqwest integration and for userinfo.
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }

underlay-auth = { path = "../underlay-auth" }
underlay-core = { path = "../underlay-core" }

[dev-dependencies]
chrono = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
