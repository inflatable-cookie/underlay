[package]
name = "underlay-ratelimit"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Rate limiting with pluggable backends for Underlay"

[features]
default = []
postgres = ["dep:sqlx"]

[dependencies]
async-trait = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time", "sync", "rt"] }
tracing = { workspace = true }

# For in-memory backend
dashmap = "6"

# For the distributed Postgres backend (feature = "postgres")
sqlx = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
underlay-testing = { path = "../underlay-testing", features = ["db"] }

[lints]
workspace = true
