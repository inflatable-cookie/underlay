[package]
name = "underlay-blob"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Blob storage adapter for Underlay applications"

[features]
default = []
s3 = ["aws-sdk-s3", "aws-smithy-runtime-api", "underlay-aws"]
local = ["tokio/fs", "tokio/io-util"]

[dependencies]
async-trait = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true, features = ["derive"] }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

# AWS S3 adapter (optional)
aws-sdk-s3 = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio", "sigv4a"], optional = true }
aws-smithy-runtime-api = { version = "1", optional = true }
underlay-aws = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
