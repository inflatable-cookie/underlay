openapi: 3.1.0
info:
  title: Underlay Contracts
  version: 0.0.1
paths: {}
components:
  schemas:
    ErrorBody:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        fieldErrors:
          type: object
          additionalProperties:
            type: string
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
    ListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {}
    SingleResponse:
      type: object
      required: [data]
      properties:
        data: {}
