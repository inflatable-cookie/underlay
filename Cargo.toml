[workspace]
members = ["rust/crates/*"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"

[workspace.dependencies]
async-trait = "0.1"
axum = "0.7"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde", "clock"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", features = ["runtime-tokio-rustls", "postgres", "uuid", "migrate", "chrono", "json"] }
thiserror = "1"
tokio = "1"

# Image processing
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }

# Metrics
prometheus = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "request-id", "propagate-header"] }
http = "1"
underlay-aws = { path = "rust/crates/underlay-aws" }
underlay-http-client = { path = "rust/crates/underlay-http-client" }
uuid = { version = "1", features = ["serde", "v7"] }
utoipa = "5.4.0"
