[workspace]
members = ["rust/crates/*"]
resolver = "2"

[workspace.package]
version = "0.9.4"
rust-version = "1.95"
edition = "2021"
license = "MIT"

[workspace.dependencies]
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde", "clock"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "migrate", "chrono", "json"] }
thiserror = "2"
tokio = "1"
toml = "1.1"

# Image processing
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }

# Metrics
prometheus = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "request-id", "propagate-header"] }
http = "1"
underlay-aws = { path = "rust/crates/underlay-aws" }
underlay-http-client = { path = "rust/crates/underlay-http-client" }
uuid = { version = "1", features = ["serde", "v7"] }
utoipa = "5.5.0"

# Hashing / encoding shared deps (hoisted g08.020 to prevent version drift)
sha1 = "0.11"
sha2 = "0.11"
hex = "0.4"
url = "2"
rand = "0.10.1"

# Foundation lint baseline (g08.020). Crates opt in with `[lints] workspace = true`.
# Kept at the clippy default posture so adoption adds no new warnings; the value
# is a single greppable place to tighten workspace-wide later.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
