name: Rust

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build + test (with Postgres)
    runs-on: ubuntu-latest

    # Provisioned Postgres for the adapter integration tests. The suite reads
    # UNDERLAY_TEST_DATABASE_URL and connects here instead of spinning up a
    # testcontainer (see underlay-testing::TestDb).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      UNDERLAY_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Read rust-toolchain.toml
        id: toolchain
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          with open("rust-toolchain.toml", "rb") as f:
              tc = tomllib.load(f)["toolchain"]
          print(f"channel={tc['channel']}")
          print(f"components={','.join(tc.get('components', []))}")
          PY

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: ${{ steps.toolchain.outputs.components }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --all-features --locked

      # Unit tests (no database). Adapter integration tests are #[ignore]d here.
      - name: Test (unit)
        run: cargo test --workspace --all-features --locked

      # The #[ignore]d Postgres adapter integration tests, run explicitly against
      # the service above.
      - name: Test (Postgres adapters)
        run: |
          cargo test --locked --lib \
            -p underlay-auth-state-postgres \
            -p underlay-jobs-postgres \
            -p underlay-audit \
            -p underlay-security-alerts \
            -- --ignored
          cargo test --locked -p underlay-db --test postgres_integration -- --ignored

      # Feature-gated separately: the distributed rate-limit window test
      # (two backend instances sharing one Postgres).
      - name: Test (Postgres rate-limit backend)
        run: >-
          cargo test --locked --lib
          -p underlay-ratelimit --features postgres
          -- --ignored
