name: Underlay Rust CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'rust/**'
      - '.github/workflows/rust.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run tests
        run: |
          cd rust
          cargo test --workspace

      - name: Run clippy
        run: |
          cd rust
          cargo clippy --all-targets --all-features -- -D warnings

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin

      - name: Cache cargo-tarpaulin
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tarpaulin
          key: ${{ runner.os }}-tarpaulin-${{ hashFiles('rust/**/Cargo.lock') }}

      - name: Generate coverage report
        run: |
          cd rust
          cargo tarpaulin --outs xml --report-on target/tarpaulin

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: rust/target/tarpaulin/xml.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Check coverage thresholds
        run: |
          TOTAL=$(cat rust/target/tarpaulin/xml.xml | grep -oP '(?<=line-rate=")[^"]+' | head -1)
          PERCENTAGE=$(echo "$TOTAL * 100" | bc | cut -d. -f1)
          
          echo "Coverage: $PERCENTAGE%"
          
          # Check overall coverage is at least 50%
          if [ "$PERCENTAGE" -lt 50 ]; then
            echo "Error: Overall coverage is $PERCENTAGE%, but must be at least 50%"
            exit 1
          fi
          
          # Check critical crates meet thresholds
          JWT_COVERAGE=$(grep 'underlay-auth-jwt' rust/target/tarpaulin/xml.xml | grep -oP '(?<=line-rate=")[^"]+' | head -1 || echo "0")
          PASSWORD_COVERAGE=$(grep 'underlay-auth-password' rust/target/tarpaulin/xml.xml | grep -oP '(?<=line-rate=")[^"]+' | head -1 || echo "0")
          
          JWT_PERCENT=$(echo "$JWT_COVERAGE * 100" | bc | cut -d. -f1)
          PASSWORD_PERCENT=$(echo "$PASSWORD_COVERAGE * 100" | bc | cut -d. -f1)
          
          echo "Auth JWT coverage: $JWT_PERCENT%"
          echo "Auth Password coverage: $PASSWORD_PERCENT%"
          
          if [ "$JWT_PERCENT" -lt 80 ]; then
            echo "Error: Auth JWT coverage is $JWT_PERCENT%, but must be at least 80%"
            exit 1
          fi
          
          if [ "$PASSWORD_PERCENT" -lt 70 ]; then
            echo "Error: Auth Password coverage is $PASSWORD_PERCENT%, but must be at least 70%"
            exit 1
          fi
          
          echo "All coverage thresholds passed!"
        shell: bash
