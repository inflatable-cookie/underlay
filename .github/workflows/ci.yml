name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  ts-and-docs:
    name: TS, Svelte, and docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Setup Effigy
        uses: inflatable-cookie/setup-effigy@987fd556617ea2c3e0ab5cef6b47b250817f50c8 # v1.0.0
        with:
          version: "0.11.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `effigy qa` is `validate` (health, svelte-check, tsc, unit and component
      # tests) plus `qa:docs`, so CI and local Effigy share one definition.
      - name: Validate and docs (effigy qa)
        run: effigy qa

      # The conformance checker (ts/bin/underlay-consumer-security.sh) requires
      # ripgrep on PATH and exits 2 without it. ubuntu-latest does not guarantee
      # rg, so install it for this step.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Consumer conformance fixtures
        run: effigy check:consumer-conformance-fixtures

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2
