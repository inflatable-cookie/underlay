name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  ts-and-docs:
    name: TS, Svelte, and docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Effigy
        uses: inflatable-cookie/setup-effigy@987fd556617ea2c3e0ab5cef6b47b250817f50c8 # v1.0.0
        with:
          version: "0.11.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check package exports
        run: bun ts/scripts/check-exports.ts

      - name: Check component test hygiene
        run: bun ts/scripts/check-component-test-hygiene.ts

      - name: Check Poodle prop names
        run: bun ts/scripts/check-poodle-prop-names.ts

      - name: Check release version sync
        run: bun ts/scripts/check-release-version-sync.ts

      - name: Check guardrails
        run: bun ts/src/tools/guardrails.ts

      - name: Svelte check
        run: bun x svelte-check --tsconfig ./ts/tsconfig.json

      - name: TypeScript typecheck
        run: bun x tsc -p ./ts/tsconfig.json

      - name: Unit tests
        run: bun x vitest run

      - name: Component tests
        run: bun x vitest run -c vitest.component.config.ts

      - name: Docs checks
        run: effigy qa:docs

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
