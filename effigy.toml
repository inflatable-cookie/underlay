[catalog]
alias = "underlay"

[package_manager]
js = "bun"

[release]
version-file = "Cargo.toml"
# Underlay's root manifest is a virtual workspace, so the version lives under
# `[workspace.package]` rather than `[package]`. Effigy only auto-detects the
# latter, hence the explicit path.
version-path = "workspace.package.version"
changelog = "CHANGELOG.md"
tag-format = "v{version}"
# 0.x: breaking changes take the minor, not the major.
pre-1-0 = true
sync-files = ["Cargo.lock", "package.json"]

[release.gates]
version-sync = "effigy check:release-version-sync"
validate = "effigy validate"
clippy = "effigy rust:clippy"
rust = "effigy rust:check"

[task_defaults]
run_in = "host"

[manifest]
minimum_effigy_version = "0.7.0"

[bootstrap]
setup = ["bootstrap:deps"]

[tasks]
"bootstrap:deps" = [
    "bun install",
    "cargo fetch",
]

check = "cd {repo} && bun x svelte-check --tsconfig ./ts/tsconfig.json"
"check:types" = "cd {repo} && bun x tsc -p ./ts/tsconfig.json"
"check:exports" = "cd {repo} && bun ts/scripts/check-exports.ts"
"check:component-test-hygiene" = "cd {repo} && bun ts/scripts/check-component-test-hygiene.ts"
"check:poodle-prop-names" = "cd {repo} && bun ts/scripts/check-poodle-prop-names.ts"
"check:release-version-sync" = "cd {repo} && bun ts/scripts/check-release-version-sync.ts"
"check:guardrails" = "cd {repo} && bun ts/src/tools/guardrails.ts"
"check:workspace-shape" = "cd {repo} && bun x vitest run ts/tests/tools/workspace-shape.test.ts ts/tests/tools/merge-pr-closeout-cleanup.test.ts"
"check:env-authority" = "cd {repo} && bun x vitest run ts/tests/tools/env-authority.test.ts"
"rust:build" = "cd {repo} && cargo build --workspace"
"rust:check" = "cd {repo} && cargo check --workspace --all-features"
"rust:clippy" = "cd {repo} && cargo clippy --workspace --all-targets -- -D warnings"
"rust:test" = "cd {repo} && cargo test --workspace --all-features"
"test:unit" = "cd {repo} && bun x vitest run {args}"
"test:ui" = "cd {repo} && bun x vitest --ui {args}"
"test:components" = "cd {repo} && bun x vitest run -c vitest.component.config.ts {args}"

"qa:docs:links" = "cd {repo} && effigy docs check links README.md AGENTS.md docs/README.md docs/plan.md docs/knowledge/*.md docs/knowledge/architecture/*.md docs/knowledge/contracts/*.md docs/guides/README.md docs/triage/*.md"
"qa:docs:agent-defaults" = "cd {repo} && effigy docs check forbidden AGENTS.md README.md package.json docs/README.md docs/guides/README.md --forbid '--repo .'"
"qa:docs:contracts:local-paths" = "cd {repo} && effigy docs check forbidden docs/knowledge/contracts/*.md --forbid '/Users/' --forbid '/home/'"
"qa:docs" = [
    { task = "qa:docs:links" },
    { task = "qa:docs:agent-defaults" },
    { task = "qa:docs:contracts:local-paths" },
]

health = [
    { task = "check:exports" },
    { task = "check:component-test-hygiene" },
    { task = "check:poodle-prop-names" },
    { task = "check:release-version-sync" },
    { task = "check:guardrails" },
]

validate = [
    { task = "health" },
    { task = "check" },
    { task = "check:types" },
    { task = "test:unit" },
    { task = "test:components" },
]

qa = [
    { task = "validate" },
    { task = "qa:docs" },
]

# Action-bearing deferred-work labels only. Compatibility deprecations stay on
# Contract 023 and compiler tooling; ordinary words such as "security" or
# "note" are not doctor errors.
[scan.attention_markers]
warning = ["TODO", "REVIEW", "placeholder"]
high = ["FIXME", "HACK", "workaround", "tech debt"]
critical = ["BUG:", "SECURITY:", "remove before release"]
doctor = true
fail_on_findings = false
respect_gitignore = true
