[catalog]
alias = "underlay"

[package_manager]
js = "bun"

[release]
version-file = "Cargo.toml"
# Underlay's root manifest is a virtual workspace, so the version lives under
# `[workspace.package]` rather than `[package]`. Effigy only auto-detects the
# latter, hence the explicit path.
version-path = "workspace.package.version"
changelog = "CHANGELOG.md"
tag-format = "v{version}"
# 0.x: breaking changes take the minor, not the major.
pre-1-0 = true
sync-files = ["Cargo.lock", "package.json"]

[release.gates]
version-sync = "effigy check:release-version-sync"
validate = "effigy validate"
clippy = "effigy rust:clippy"
rust = "effigy rust:check"

[task_defaults]
run_in = "host"

[manifest]
minimum_effigy_version = "0.7.0"
include = ["demos/effigy.demos.toml"]

[bootstrap]
setup = ["bootstrap:deps"]

[docs_policy.indexes.vision]
file = "docs/vision/README.md"
dir = "docs/vision"

[docs_policy.next_actions.vision]
index = "vision"
heading = "## Next Task"
allowlist_file = "docs/policy/vision-next-task-verbs.txt"

[tasks]
"bootstrap:deps" = [
    "bun install",
    "cargo fetch",
]

check = "cd {repo} && bun x svelte-check --tsconfig ./ts/tsconfig.json"
"check:types" = "cd {repo} && bun x tsc -p ./ts/tsconfig.json"
"check:exports" = "cd {repo} && bun ts/scripts/check-exports.ts"
"check:component-test-hygiene" = "cd {repo} && bun ts/scripts/check-component-test-hygiene.ts"
"check:poodle-prop-names" = "cd {repo} && bun ts/scripts/check-poodle-prop-names.ts"
"check:release-version-sync" = "cd {repo} && bun ts/scripts/check-release-version-sync.ts"
"check:guardrails" = "cd {repo} && bun ts/src/tools/guardrails.ts"
"check:workspace-shape" = "cd {repo} && bun x vitest run ts/tests/tools/workspace-shape.test.ts"
"check:env-authority" = "cd {repo} && bun x vitest run ts/tests/tools/env-authority.test.ts"
"storybook" = "cd {repo} && storybook dev -p 6006"
"storybook:build" = "cd {repo} && storybook build"
"rust:build" = "cd {repo} && cargo build --workspace"
"rust:check" = "cd {repo} && cargo check --workspace --all-features"
"rust:clippy" = "cd {repo} && cargo clippy --workspace --all-targets -- -D warnings"
"rust:test" = "cd {repo} && cargo test --workspace --all-features"
"test:unit" = "cd {repo} && bun x vitest run {args}"
"test:ui" = "cd {repo} && bun x vitest --ui {args}"
"test:components" = "cd {repo} && bun x vitest run -c vitest.component.config.ts {args}"

"qa:docs:links" = "cd {repo} && effigy docs check links README.md docs/README.md docs/vision/README.md docs/vision/001-underlay-foundation-vision.md docs/roadmaps/README.md docs/roadmaps/g01/README.md docs/roadmaps/g08/README.md docs/roadmaps/g09/README.md docs/logs/README.md docs/guides/README.md"
"qa:docs:index:vision" = "cd {repo} && effigy docs check index --policy-index vision"
"qa:docs:agent-defaults" = "cd {repo} && effigy docs check forbidden AGENTS.md README.md package.json docs/README.md docs/guides/README.md --forbid '--repo .'"
"qa:docs:vision:next-action" = "cd {repo} && effigy docs check next-action --policy vision"
"qa:docs" = [
    { task = "qa:docs:links" },
    { task = "qa:docs:index:vision" },
    { task = "qa:docs:agent-defaults" },
    { task = "qa:docs:vision:next-action" },
]

"qa:northstar:vision" = "cd {repo} && effigy docs check headings docs/vision/001-underlay-foundation-vision.md --require-heading '## Long-Term Outcome' --require-heading '## Core Platform Behaviors' --require-heading '## Strategic Constraints' --require-heading '## Longer-Term Focus' --require-heading '## Next Task'"
"qa:northstar:roadmaps" = "cd {repo} && effigy docs check headings docs/roadmaps/README.md --require-heading '## Rules' --require-heading '## Active generation' --require-heading '## Current Queue' --require-heading '## Next Task'"
"qa:northstar:g01" = "cd {repo} && effigy docs check headings docs/roadmaps/g01/README.md --require-heading '## Current Generation' --require-heading '## Historical Language Boundary' --require-heading '## Next Task'"
"qa:northstar:g09" = "cd {repo} && effigy docs check headings docs/roadmaps/g09/README.md --require-heading '## Current Generation' --require-heading '## Roadmap Sequence' --require-heading '## Queue' --require-heading '## Dependencies And Parallelism' --require-heading '## Next Task'"
"qa:northstar" = [
    { task = "qa:northstar:vision" },
    { task = "qa:northstar:roadmaps" },
    { task = "qa:northstar:g01" },
    { task = "qa:northstar:g09" },
]

health = [
    { task = "check:exports" },
    { task = "check:component-test-hygiene" },
    { task = "check:poodle-prop-names" },
    { task = "check:release-version-sync" },
    { task = "check:guardrails" },
]

validate = [
    { task = "health" },
    { task = "check" },
    { task = "check:types" },
    { task = "test:unit" },
    { task = "test:components" },
]

qa = [
    { task = "validate" },
    { task = "qa:docs" },
    { task = "qa:northstar" },
]
